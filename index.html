}
function aiIntent(q){
  const x=q.toLowerCase(), r=aiRole(), staff=r==="teacher"||r==="admin";
  const has=(...w)=>w.some(v=>x.includes(v));
  if(has("заявк","request","настрой","setup","set up","програм","timetable"))return r==="admin"?"setup":"week";
  if(has("най-добр","best","кога да","when should","ден за","day for"))return staff?"best":"busy";
  if(has("претовар","overload","натовар","busy","busiest"))return staff?"overload":"busy";
  if(has("учен","учa","study","подготв","prepare","преговор","revise"))return staff?"best":"study";
  if(has("предал","предад","предаде","submit","handed","домашн","homework","не съм","haven't"))return staff?"missing":"todo";
  if(has("утре","tomorrow","днес","today"))return staff?"myweek":"tomorrow";
  if(has("седмиц","week","предстои","coming"))return staff?"myweek":"week";
  return "";
}
const aiDay=k=>{const d=parse(k);return `${dname(d)} ${fmt(d)}`};
const aiTask=x=>`<b>${esc(subj(x.subject))}</b> ${typeName(x.type).toLowerCase()}${x.note?" · "+esc(x.note):""}`;
const aiDone=x=>TRACKED(x.type)?["submitted","graded"].includes(wsOf(x.id)):!!S.done[x.id];
// each answer: {text (html), acts:[[label, fn]]}
async function aiAnswer(intent){
  const c=activeCls(), up=clsTasks().filter(x=>x.date>=TODAY_K).sort((a,b)=>a.date.localeCompare(b.date));
  if(intent==="tomorrow"){
    let d=addDays(TODAY,1); while(d.getDay()===0||d.getDay()===6)d=addDays(d,1);
    const list=up.filter(x=>x.date===key(d));
    return {text:list.length?`${t("On {day} you have:",{day:dlong(d)})}<ul>${list.map(x=>`<li>${aiTask(x)}${x.period?" · "+periodWord(x.period):""}</li>`).join("")}</ul>`:t("Nothing is due on {day}. Enjoy it!",{day:dlong(d)})}}
  if(intent==="week"){
    const end=key(addDays(HOME_MON,6)), list=up.filter(x=>x.date<=end);
    return {text:list.length?`${t("Coming up until Sunday ({n}):",{n:list.length})}<ul>${list.map(x=>`<li>${aiDay(x.date)} · ${aiTask(x)}</li>`).join("")}</ul>`:t("Nothing more this week.")}}
  if(intent==="todo"){
    const list=up.filter(x=>TRACKED(x.type)&&!["submitted","graded"].includes(wsOf(x.id)));
    if(!list.length)return {text:t("Everything is handed in. Well done!")};
    const n=x=>Math.round((parse(x.date)-TODAY)/864e5);
    return {text:`${t("Not handed in yet:")}<ul>${list.map(x=>`<li>${aiTask(x)} · ${n(x)<=0?t("due today"):t("due in {n} days",{n:n(x)})} · ${t(WS[wsOf(x.id)])}</li>`).join("")}</ul>${list.some(x=>n(x)<=1)?`<p>${t("Start with the one due first.")}</p>`:""}`}}
  if(intent==="study"){
    const big=up.find(x=>TYPES[x.type].w>=3&&parse(x.date)>TODAY);
    if(!big)return {text:t("No tests or projects coming up, so no study plan is needed right now.")};
    const plan=studyPlan(big);
    return {text:`${t("For {what} on {day}:",{what:aiTask(big),day:aiDay(big.date)})}<ol>${plan.map(p=>`<li><b>${dname(p.d)} ${fmt(p.d)}</b> · ${p.min} ${t("min")} · ${p.what}</li>`).join("")}</ol><p>${t("I picked the evenings with the least other work.")}</p>`}}
  if(intent==="busy"){
    const w=Array.from({length:4},(_,i)=>addDays(HOME_MON,i*7)).map(m=>({m,p:weekPts(m)})).sort((a,b)=>b.p-a.p)[0];
    if(!w||!w.p)return {text:t("The next 4 weeks are empty so far.")};
    const list=clsTasks().filter(x=>x.date>=key(w.m)&&x.date<=key(addDays(w.m,6)));
    return {text:`${t("The busiest is the week of {d}: {p} pts ({lv}).",{d:fmt(w.m),p:w.p,lv:levelName(level(w.p)).toLowerCase()})}<ul>${list.map(x=>`<li>${aiDay(x.date)} · ${aiTask(x)}</li>`).join("")}</ul>${w.p>=7?`<p>${t("Start preparing for it the week before.")}</p>`:""}`}}
  if(intent==="best"){
    const mine=mySubjectsIn(c);
    if(mine&&!mine.length)return {text:t("You don't teach in {cls}. Pick one of your classes at the top first.",{cls:esc(c)})};
    const sub=mine&&!mine.includes(S.draft.subject)?mine[0]:S.draft.subject, keep=S.draft.subject; S.draft.subject=sub;
    const best=bestDays("test"); S.draft.subject=keep;
    if(!best.length)return {text:t("I couldn't find an allowed day in the next 4 weeks for {cls}.",{cls:esc(c)})};
    return {text:`${t("Best days for a {subject} test in {cls} (the law and the timetable are checked):",{subject:esc(subj(sub)),cls:esc(c)})}<ul>${best.slice(0,3).map(b=>`<li><b>${aiDay(b.k)}</b>${b.les&&b.les.length?" · "+periodWord(b.les[0]):""} · ${t("week → {p} pts",{p:b.pts})}</li>`).join("")}</ul>`,
      acts:best.slice(0,3).map(b=>[t("Plan on {day}",{day:aiDay(b.k)}),()=>{S.tab="plan";S.draft={...S.draft,type:"test",subject:sub,date:b.k};S.viewMon=mondayOf(parse(b.k));closeAI();render()}])}}
  if(intent==="overload"){
    const all=S.tasks.filter(x=>x.school===CUR.school), hot=[];
    classesOf(CUR.school).forEach(cl=>{const l=all.filter(x=>x.cls===cl);for(let i=0;i<OVERVIEW_WEEKS;i++){const m=addDays(HOME_MON,i*7),p=ptsIn(l,m);if(p>=10)hot.push({cl,m,p})}});
    const law=lawBreaches(all);
    if(!hot.length&&!law.length)return {text:t("No class is overloaded in the next {n} weeks, and all tests are within the legal limits.",{n:OVERVIEW_WEEKS})};
    return {text:`${hot.length?`${t("Overloaded weeks (10+ pts):")}<ul>${hot.map(h=>`<li><b>${esc(h.cl)}</b> · ${t("week of {d}",{d:fmt(h.m)})} · ${h.p} ${t("pts")}</li>`).join("")}</ul>`:""}${law.length?`${t("Test-limit problems:")}<ul>${law.slice(0,6).map(b=>`<li><b>${esc(b.cls)}</b> · ${b.kind==="day"?t("{n} tests on {d}",{n:b.n,d:aiDay(b.d)}):t("{n} tests in the week of {d}",{n:b.n,d:fmt(parse(b.d))})}</li>`).join("")}</ul>`:""}<p>${t("Moving one test or project to a calm week usually fixes it.")}</p>`,
      acts:hot.slice(0,3).map(h=>[t("Open {cls}, {d}",{cls:h.cl,d:fmt(h.m)}),()=>{S.cls=h.cl;ls.set("cl-class",h.cl);S.viewMon=h.m;S.tab="plan";closeAI();render()}])}}
  if(intent==="myweek"){
    const end=key(addDays(TODAY,14)), list=S.tasks.filter(x=>x.school===CUR.school&&x.date>=TODAY_K&&x.date<=end&&(x.by===S.user.uid||(myTeaches().length&&canEditTask(x)))).sort((a,b)=>a.date.localeCompare(b.date));
    return {text:list.length?`${t("Your tasks in the next 2 weeks ({n}):",{n:list.length})}<ul>${list.map(x=>`<li>${aiDay(x.date)} · <b>${esc(x.cls)}</b> · ${aiTask(x)}</li>`).join("")}</ul>`:t("You have nothing planned in the next 2 weeks.")}}
  if(intent==="missing"){
    const cand=S.tasks.filter(x=>x.school===CUR.school&&TRACKED(x.type)&&canEditTask(x)&&x.date<=key(addDays(TODAY,7))&&x.date>=key(addDays(TODAY,-21))).sort((a,b)=>b.date.localeCompare(a.date));
    const task=cand.find(x=>x.date<=TODAY_K)||cand[0];
    if(!task)return {text:t("You have no homework or projects due around now.")};
    const studs=Object.entries(S.members).filter(([,m])=>m.role==="student"&&m.school===CUR.school&&m.cls===task.cls);
    if(!studs.length)return {text:t("No approved students in {cls} yet.",{cls:esc(task.cls)})};
    const snap=await getDocs(query(collection(db,"work"),where("school","==",CUR.school),where("task","==",task.id)));
    const st={}; snap.forEach(d=>{const w=normWork(d.data());st[w.student]=w.status});
    const miss=studs.filter(([u])=>!["submitted","graded"].includes(st[u]||"todo"));
    return {text:`${aiTask(task)} · <b>${esc(task.cls)}</b> · ${aiDay(task.date)}<br>${miss.length?`${t("Not handed in ({n} of {m}):",{n:miss.length,m:studs.length})}<ul>${miss.map(([,m])=>`<li>${esc(m.name)}</li>`).join("")}</ul>`:t("Everyone has handed it in.")}`,
      acts:[[t("Open Assignments"),()=>{S.cls=task.cls;S.workTask=task.id;S.tab="work";closeAI();render()}]]}}
  if(intent==="setup"){
    const pend=pendingFor(CUR.school).length, mem=Object.values(S.members).filter(m=>m.school===CUR.school);
    const noSub=mem.filter(m=>m.role==="teacher"&&!m.teaches.length).map(m=>m.name), noTT=classesOf(CUR.school).filter(cl=>!ttOf(cl)), unlinked=mem.filter(m=>m.role==="parent"&&!m.childUid).length;
    const items=[pend?t("{n} people waiting for approval",{n:pend}):"",noSub.length?t("Teachers without subjects: {list}",{list:esc(noSub.join(", "))}):"",noTT.length?t("Classes without a timetable: {list}",{list:esc(noTT.join(", "))}):"",unlinked?t("{n} parents not linked to their child",{n:unlinked}):"",!termEndsOf(CUR.school).length?t("Term end dates aren't set"):""].filter(Boolean);
    const acts=[];if(pend)acts.push([t("Open Requests"),()=>{S.tab="requests";closeAI();render()}]);if(noSub.length||unlinked||!termEndsOf(CUR.school).length)acts.push([t("Open People"),()=>{S.tab="people";closeAI();render()}]);if(noTT.length)acts.push([t("Open Timetable"),()=>{S.cls=noTT[0];S.tab="schedule";closeAI();render()}]);
    return {text:items.length?`${t("Still to do:")}<ul>${items.map(i=>`<li>${i}</li>`).join("")}</ul>`:t("Everything is set up. Nice."),acts}}
  return {text:t("I didn't get that. Try one of these:"),chips:true};
}
function closeAI(){S.ai.open=false;renderAI()}
async function aiAsk(intent,label){

  A.msgs.push({text:ans.text,acts:ans.acts||[],chips:ans.chips}); A.busy=false; if(A.msgs.length>30)A.msgs.splice(0,A.msgs.length-30); renderAI();
}

function renderInfo(app){
  const L=LANG==="bg"?"bg":"en";
  const back=`<button class="back info-back" id="infoBack">← ${t("Back")}</button>`;
  if(S.info==="help"){
    const myRole=CUR?CUR.role:null, sec=HELP[L];
    const openId=myRole==="student"?"student":myRole==="parent"?"parent":myRole==="teacher"?"teacher":myRole==="admin"?"teacher":"start";
    app.innerHTML=`<div class="info">${back}<header class="info-head"><h1>${t("Help")}</h1><p>${t("Short guides for every role. Tap a topic to open it.")}</p></header>
      <nav class="info-nav" aria-label="${t("Topics")}">${sec.map(s=>`<a href="#h-${s.id}">${esc(s.title)}</a>`).join("")}</nav>
      ${sec.map(s=>`<details class="info-sec" id="h-${s.id}"${s.id===openId?" open":""}><summary>${esc(s.title)}</summary><dl>${s.items.map(([q,a])=>`<dt>${esc(q)}</dt><dd>${esc(a)}</dd>`).join("")}</dl></details>`).join("")}
      <p class="hint">${t("Still stuck? Ask your school's ClassLoad admin.")}</p></div>`;
    app.querySelectorAll(".info-nav a").forEach(a=>a.onclick=e=>{e.preventDefault();const d=app.querySelector(a.getAttribute("href"));if(d){d.open=true;d.scrollIntoView({behavior:"smooth",block:"start"})}});
  } else {
    const P=PRIVACY[L];
    const ownerMail=S.ownerDoc&&S.ownerDoc.email?` (${esc(S.ownerDoc.email)})`:"";
    const canDelete=S.user&&!isOwner();
    app.innerHTML=`<div class="info">${back}<header class="info-head"><h1>${t("Privacy")}</h1><p>${esc(P.intro)}</p></header>
      ${P.sections.map(([h,list])=>`<section class="info-card"><h2>${esc(h)}</h2><ul>${list.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></section>`).join("")}
      <section class="info-card"><h2>${t("Delete my data")}</h2>
        ${canDelete?`<p class="hint">${t("This removes your account details, class membership, ticks, reminders and any pending request from ClassLoad. Tasks teachers created stay with the class.")}</p>
          ${deleteArmed?`<div class="del-confirm"><p><b>${t("Delete all your ClassLoad data?")}</b> ${t("You'll need to ask to join your school again. This can't be undone.")}</p>
            <div class="acts"><button class="sbtn danger" id="delMe" ${deleting?"disabled":""}>${deleting?t("Deleting…"):t("Yes, delete my data")}</button><button class="sbtn" id="delNo" ${deleting?"disabled":""}>${t("Cancel")}</button></div></div>`
          :`<button class="sbtn no" id="delArm">${t("Delete my data")}</button>`}`
        :S.user?`<p class="hint">${t("You're the owner. To remove everything, delete the schools in the Owner console, or the whole project in Firebase.")}</p>`
        :`<p class="hint">${t("Sign in first to delete your data.")}</p>`}
      </section>
      <p class="hint">${P.contact.replace("{owner}",ownerMail)}</p></div>`;
    const da=app.querySelector("#delArm"); if(da)da.onclick=()=>{deleteArmed=true;renderInfo(app)};
    const dn=app.querySelector("#delNo"); if(dn)dn.onclick=()=>{deleteArmed=false;renderInfo(app)};
    const dm=app.querySelector("#delMe"); if(dm)dm.onclick=deleteMyData;
  }
  app.querySelector("#infoBack").onclick=closeInfo;
}
async function deleteMyData(){
  if(!S.user||isOwner()||deleting)return;
  deleting=true; render();
  const uid=S.user.uid; let failed=false;
  if(R.state==="on"){ls.set("cl-push",null);R.state="off"}
  try{const ws=await getDocs(query(collection(db,"work"),where("student","==",uid)));for(const d of ws.docs)await deleteDoc(d.ref)}catch(e){failed=true}
  for(const c of ["tokens","progress","requests","members"]){try{await deleteDoc(doc(db,c,uid))}catch(e){failed=true}}
  deleting=false; deleteArmed=false;
  if(failed){toast(t("Some data couldn't be deleted. Ask your school's admin to remove you."));render();return}
  toast(t("Your data was deleted"));
  S.hadReq=false; S.info=null; await signOut(auth);
}

  render();
