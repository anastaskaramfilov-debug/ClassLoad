.dl-lead em{font-style:normal}.dl-lead em.ok{color:#8BF0B5}.dl-lead em.warn{color:#FFD58A}.dl-lead em.bad{color:#FFA3AD}
.dl-meter{margin-top:8px;height:7px;border-radius:9px;background:rgba(255,255,255,.25);overflow:hidden}

.dl-meter i.ok,.dp-prog i b{background:#10B981}.dl-meter i.warn{background:#F59E0B}.dl-meter i.bad{background:#EF4444}
.dl-types{grid-column:1/-1;display:flex;gap:8px;margin-top:6px}
.dl-types button{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;transition:background .2s}
.dl-types button:hover{background:rgba(255,255,255,.22)}
.dl-types button[aria-pressed="true"]{background:#fff;color:#0F172A;box-shadow:inset 0 0 0 2px var(--c)}
.dl-days{flex:1;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;min-height:0}

/* v41 colour system: slate + indigo, green/amber/red for workload, sky for homework, violet for tests */
:root,:root[data-theme="light"]{
  --bg:#F8FAFC; --surface:#FFFFFF; --surface-2:#F1F5F9; --surface-3:#F8FAFC;
  --ink:#0F172A; --ink-strong:#0F172A; --muted:#475569; --line:#E2E8F0; --line-2:#CBD5E1; --hair:#E2E8F0;
  --brand:#4F46E5; --accent:#6366F1; --accent-hover:#4F46E5; --accent-ink:#FFFFFF; --accent-soft:#EEF2FF;
  --ok:#047857; --ok-bar:#10B981; --ok-soft:#D1FAE5;
  --warn:#B45309; --warn-bar:#F59E0B; --warn-soft:#FEF3C7;
  --bad:#B91C1C; --bad-bar:#EF4444; --bad-soft:#FEE2E2;
  --hero-a:#4338CA; --hero-b:#4F46E5; --hero-c:#6366F1;
}
:root[data-theme="dark"]{
  --bg:#0F172A; --surface:#1E293B; --surface-2:#273449; --surface-3:#172033;
  --ink:#F8FAFC; --ink-strong:#F8FAFC; --muted:#94A3B8; --line:#334155; --line-2:#475569; --hair:#334155;
  --brand:#818CF8; --accent:#818CF8; --accent-hover:#A5B4FC; --accent-ink:#0F172A; --accent-soft:#272F5A;
  --ok:#34D399; --ok-bar:#10B981; --ok-soft:#0F3B33;
  --warn:#FBBF24; --warn-bar:#F59E0B; --warn-soft:#3D2E10;
  --bad:#F87171; --bad-bar:#EF4444; --bad-soft:#42191E;
  --hero-a:#1E293B; --hero-b:#262F6B; --hero-c:#3730A3; color-scheme:dark;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F172A; --surface:#1E293B; --surface-2:#273449; --surface-3:#172033;
  --ink:#F8FAFC; --ink-strong:#F8FAFC; --muted:#94A3B8; --line:#334155; --line-2:#475569; --hair:#334155;
  --brand:#818CF8; --accent:#818CF8; --accent-hover:#A5B4FC; --accent-ink:#0F172A; --accent-soft:#272F5A;
  --ok:#34D399; --ok-bar:#10B981; --ok-soft:#0F3B33;

.bar{background:var(--surface);border-bottom-color:var(--line)}

.ty-hw{--ty:#0EA5E9} .ty-test{--ty:#8B5CF6} .ty-quiz{--ty:#A855F7} .ty-project{--ty:#EC4899}
:root[data-theme="dark"] .ty-hw{--ty:#38BDF8} :root[data-theme="dark"] .ty-test{--ty:#A78BFA} :root[data-theme="dark"] .ty-quiz{--ty:#C084FC} :root[data-theme="dark"] .ty-project{--ty:#F472B6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ty-hw{--ty:#38BDF8}:root:not([data-theme="light"]) .ty-test{--ty:#A78BFA}:root:not([data-theme="light"]) .ty-quiz{--ty:#C084FC}:root:not([data-theme="light"]) .ty-project{--ty:#F472B6}}
.pill.ty,.task .kind[class*="ty-"],.kind[class*="ty-"]{background:color-mix(in srgb,var(--ty) 14%,transparent);color:color-mix(in srgb,var(--ty) 78%,var(--ink))}
/* indigo week card (app) */
#hero.hero,#hero.hero[class]{background:radial-gradient(60% 90% at 80% 0%,rgba(255,255,255,.18),transparent 60%),linear-gradient(160deg,var(--hero-a) 0%,var(--hero-b) 55%,var(--hero-c) 100%)!important}

/* v42 owner console: mission control (always dark, just for the owner) */
body.oc-on{--bg:#060A14;--surface:#0D1324;--surface-2:#141C31;--surface-3:#0A1020;--ink:#E2E8F0;--ink-strong:#F8FAFC;--muted:#8D9AB5;--line:rgba(148,163,184,.16);--line-2:rgba(148,163,184,.28);--hair:rgba(148,163,184,.12);
  --brand:#818CF8;--accent:#818CF8;--accent-hover:#A5B4FC;--accent-ink:#0B1020;--accent-soft:rgba(129,140,248,.14);
  --ok:#34D399;--ok-soft:rgba(16,185,129,.14);--warn:#FBBF24;--warn-soft:rgba(245,158,11,.14);--bad:#F87171;--bad-soft:rgba(239,68,68,.14);
  --shadow:0 0 0 1px rgba(148,163,184,.08);color-scheme:dark;
  background:radial-gradient(900px 500px at 85% -10%,rgba(99,102,241,.28),transparent 60%),radial-gradient(700px 500px at -10% 20%,rgba(34,211,238,.10),transparent 60%),#060A14 fixed;color:var(--ink)}
body.oc-on::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(129,140,248,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(129,140,248,.06) 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 30%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 0%,#000 30%,transparent 75%)}
body.oc-on .wrap{position:relative;z-index:1}
body.oc-on .bar{background:rgba(6,10,20,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom-color:rgba(148,163,184,.12)}
body.oc-on .oc{max-width:none;gap:18px}
/* header */
.oc-hq{align-items:flex-end;padding:18px 0 4px}
.oc-kicker{margin:0 0 8px;font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#A5B4FC;display:flex;align-items:center;gap:10px}
.oc-live{width:8px;height:8px;border-radius:50%;background:#34D399;box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:ocPulse 2s infinite}
@keyframes ocPulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.55)}70%{box-shadow:0 0 0 10px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.oc-head h1.oc-greet{font-family:"Inter Tight","Inter",var(--font);font-size:clamp(2rem,1.4rem + 2.4vw,3.3rem);line-height:1.02;letter-spacing:-.03em;font-weight:700;margin:0;
  background:linear-gradient(92deg,#F8FAFC 10%,#C7D2FE 45%,#818CF8 75%,#22D3EE);-webkit-background-clip:text;background-clip:text;color:transparent}

.oc-status[data-go]{cursor:pointer}

.oc-status.ok{color:#34D399;border-color:rgba(52,211,153,.35);background:rgba(16,185,129,.08)}

op":"Спри","Start":"Старт","Focus session started. Put your phone away.":"Сесията започна. Остави телефона настрана.","Quiz me for my next test":"Изпитай ме за следващия тест","Draft questions for my next test":"Въпроси за следващия ми тест","On a test or project, tap “Study plan” to get revision sessions on your calmest evenings, plus a final review the night before. On the day of a session, tap “Start” for a focus timer.":"При тест или проект натисни „План за учене“ и ще получиш сесии за преговор в най-спокойните вечери плюс последен преговор вечерта преди това. В деня на сесията натисни „Старт“ за таймер за фокус.","On a test or quiz, tap “Practice quiz”: the AI writes 5 questions on the topic and you answer them by tapping. Or ask the assistant, e.g. “quiz me on photosynthesis”.":"При тест или проверка натисни „Тренировъчен тест“: AI-ът пише 5 въпроса по темата, а ти отговаряш с докосване. Или попитай асистента, напр. „изпитай ме по фотосинтеза“.","Ask the assistant e.g. “make questions about the water cycle”, or tap “Draft questions for my next test”. The AI writes 5 multiple-choice questions with the answers marked; tap “Copy questions” and edit them into your own test.":"Попитай асистента напр. „направи въпроси за кръговрата на водата“ или натисни „Въпроси за следващия ми тест“. AI-ът пише 5 въпроса с избираем отговор и отбелязани верни отговори; натисни „Копирай въпросите“ и ги нагласи в своя тест.","Textbooks":"Учебници","Not chosen yet":"Още не е избран","Publisher":"Издателство","Choose a publisher…":"Избери издателство…","Publisher or textbook":"Издателство или учебник","Title or authors (optional)":"Заглавие или автори (по желание)","Save for all grade {g} classes ({n})":"Запази за всички {g}. класове ({n})","Removed":"Премахнато","Saved for {list}.":"Запазено за {list}.","Choose the textbook you use in each subject. Students and parents of {cls} see it, and the AI uses it for practice quizzes.":"Избери учебника, по който работиш във всеки предмет. Учен // ---- the law: Наредба № 11 (2016) за оценяването, чл. 20, ал. 1 ----
// For one class: at most one класна/контролна работа a day, at most two a week, none in a term's last week.
// In ClassLoad these are "Test" tasks. Quizzes (текущи изпитвания), homework and projects are not limited by it.
const LAW_REF="Наредба № 11 за оценяването, чл. 20, ал. 1";
const termEndsOf=sch=>(S.schools[sch]&&S.schools[sch].termEnds)||[];
function lawCheckIn(list,k,type,sch){
  if(type!=="test")return null;
  const tests=list.filter(x=>x.type==="test");
  if(tests.some(x=>x.date===k))return {why:"day",msg:t("There's already a test that day. The rules allow one test a day per class.")};

  } else if(c&&c.role==="admin"){

    roleSubs.push(onSnapshot(query(collection(db,"members"),where("school","==",c.school)),s=>{S.members=mapSnap(s,normPerson);render()},err));
  }

// splash screen: stays until the first real screen is ready, then fades away
let splashGone=false;
function splashState(loading,msg){
  const sp=document.getElementById("splash"); if(!sp){splashGone=true;return}
  if(loading){const tx=document.getElementById("spTxt");if(tx&&msg)tx.textContent=msg;return}
  if(splashGone)return; splashGone=true;
  const wait=Math.max(0,650-(Date.now()-(window.__splashAt||0)));

}

// a profile picture, shrunk to 160×160 on the device and stored with the person's member record (no paid storage needed)
async function uploadPhoto(file){
  if(!/^image\//.test(file.type))return toast(t("Pick a picture file."));
  try{
    const url=URL.createObjectURL(file); const img=new Image(); img.src=url; await img.decode();
    const n=160, c=document.createElement("canvas"); c.width=n; c.height=n; const g=c.getContext("2d");
    const side=Math.min(img.naturalWidth,img.naturalHeight); g.drawImage(img,(img.naturalWidth-side)/2,(img.naturalHeight-side)/2,side,side,0,0,n,n);
    URL.revokeObjectURL(url);
    let data=c.toDataURL("image/jpeg",0.82); if(data.length>90000)data=c.toDataURL("image/jpeg",0.6);
    await updateDoc(doc(db,"members",S.user.uid),{photo:data}); toast(t("Picture updated"));
  }catch(e){toast(e&&e.code?failMsg(e):t("Couldn't use that picture. Try another one."))}
}

// Everything here reads the live database; every write is checked again by the Firestore rules.
const OC_DEF={tab:"overview",school:null,stab:"overview",q:"",flt:"active",uq:"",urole:"",usch:"",rq:"pending",rqq:"",rsch:"",aq:"",asch:"",newOpen:false,edit:null,del:null,delName:"",inv:{school:"",role:"teacher"},rv:"pending",peopleQ:""};
const ROLE_ORDER=["admin","teacher","student","parent"];
const AUDIT_N={"school.create":"created the school","school.edit":"edited the school","school.archive":"archived the school","school.restore":"restored the school","school.delete":"deleted the school",
  "request.approve":"approved","request.reject":"declined","member.role":"changed the role of","member.revoke":"removed access for","member.move":"moved","member.subjects":"changed the subjects of",
  "class.add":"added a class","class.remove":"removed a class","term.save":"saved term dates","timetable.save":"saved a timetable"};
function ocCounts(){
  const mem=Object.entries(S.members), by={}; ROLE_ORDER.forEach(r=>by[r]=0);
  const perSchool={}; mem.forEach(([,m])=>{by[m.role]=(by[m.role]||0)+1;(perSchool[m.school]=perSchool[m.school]||{admin:0,teacher:0,student:0,parent:0})[m.role]++});
  const reqs=Object.entries(S.requests), pend=reqs.filter(([,r])=>isPending(r));
  return {mem,by,perSchool,reqs,pend,pendAdmin:pend.filter(([,r])=>r.role==="admin").length};
}
const schoolIds=()=>Object.keys(S.schools).sort((a,b)=>S.schools[a].name.localeCompare(S.schools[b].name,LOC()));
const sc0=(C,sid,r)=>(C.perSchool[sid]||{})[r]||0;
function auditLine(a){
  const verb=t(AUDIT_N[a.action]||a.action);
  return `<li class="au"><span class="au-dot ${a.action.split(".")[0]}" aria-hidden="true"></span><div><p><b>${esc(a.byName||"?")}</b> ${esc(verb)}${a.targetName?` <b>${esc(a.targetName)}</b>`:""}${a.detail?` <span class="muted">· ${esc(a.detail)}</span>`:""}</p>
    <small>${a.schoolName?esc(a.schoolName)+" · ":""}${fmtStamp(a.at)}</small></div></li>`;
}
function renderOwner(app){
  const O=S.oc=S.oc||JSON.parse(JSON.stringify(OC_DEF)), C=ocCounts(), ids=schoolIds();
  const open=O.school&&S.schools[O.school]?O.school:null; // a just-created school may not have arrived yet
  const tabs=[["overview",t("Overview")],["schools",t("Schools"),ids.length],["users",t("Users"),C.mem.length],["requests",t("Requests"),C.pend.length],["activity",t("Activity")]];
  let body="";
  if(O.tab==="schools"&&open)body=ocSchool(open,C);
  else if(O.tab==="schools")body=ocSchools(C,ids);
  else if(O.tab==="users")body=ocUsers(C,ids);
  else if(O.tab==="requests")body=ocRequests(C,ids);
  else if(O.tab==="activity")body=ocActivity(ids);
  else body=ocOverview(C,ids);
  const hr=new Date().getHours(), nm=esc(String(S.user.displayName||"").trim().split(/\s+/)[0]||t("Owner"));
  const greet=hr<5?t("Working late, {name}?",{name:nm}):hr<12?t("Good morning, {name}",{name:nm}):hr<18?t("Good afternoon, {name}",{name:nm}):t("Good evening, {name}",{name:nm});
  const stat=C.pendAdmin?["bad",t("{n} admin requests waiting",{n:C.pendAdmin})]:C.pend.length?["warn",t("{n} requests waiting",{n:C.pend.length})]:["ok",t("All systems normal")];
  app.innerHTML=`<div class="oc">
    <header class="oc-head oc-hq"><div class="oc-hq-l"><p class="oc-kicker"><span class="oc-live" aria-hidden="true"></span>ClassLoad // ${t("Owner console")}</p>
        <h1 class="oc-greet">${greet}</h1><p class="oc-sub">${t("Schools, people and access across ClassLoad.")}</p></div>
      <div class="oc-hq-r"><div class="oc-clock" aria-hidden="true"><b id="ocClock">${ocTime()}</b><small>${new Date().toLocaleDateString(LOC(),{weekday:"long",day:"numeric",month:"long"})}</small></div>
        <button type="button" class="oc-status ${stat[0]}" ${C.pend.length?'data-go="requests"':""}><i aria-hidden="true"></i>${stat[1]}</button>
        <div class="oc-acts"><button type="button" class="oc-cmd" id="ocCmd"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>${t("Jump to anything")}</span><kbd>Ctrl K</kbd></button>
        <button class="btn inline add-btn" id="ocNew">${ICON_PLUS}${t("New school")}</button></div></div></header>
    <nav class="oc-tabs" aria-label="${t("Owner console")}">${tabs.map(([k,l,n])=>`<button data-oct="${k}" ${O.tab===k?'aria-current="page"':""}>${l}${n?`<span class="oc-n${k==="requests"&&n?" hot":""}">${n}</span>`:""}</button>`).join("")}</nav>
    <div class="oc-body">${body}</div></div>`;
  app.querySelectorAll("[data-oct]").forEach(b=>b.onclick=()=>{O.tab=b.dataset.oct;O.school=null;O.edit=null;O.del=null;S.rejecting=null;render();toTop()});
  app.querySelector("#ocNew").onclick=()=>{O.tab="schools";O.school=null;O.newOpen=true;render();const i=document.getElementById("nsName");if(i)i.focus()};
  app.querySelector("#ocCmd").onclick=()=>ocPalette();
  wireOwner(app,O);
  if(!ocClockT)ocClockT=setInterval(()=>{const c=document.getElementById("ocClock");if(c)c.textContent=ocTime()},1000);
  const ak=O.tab+"|"+(O.school||""); if(S.ocAnimKey!==ak){S.ocAnimKey=ak;ocCountUp(app)}
}
// ---- console extras: live clock, count-up numbers, the "people" hero and a Ctrl+K jump palette
let ocClockT=null;
const ocTime=()=>new Date().toLocaleTimeString(LOC(),{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
function ocCountUp(root){
  let reduce=false; try{reduce=matchMedia("(prefers-reduced-motion: reduce)").matches}catch(e){}
  if(reduce||!window.requestAnimationFrame)return;
  root.querySelectorAll(".oc [data-count], .oc-kpis .kpi b").forEach(el=>{
    const end=+(el.dataset.count||el.textContent); if(!isFinite(end)||end<=0)return;
    const t0=performance.now(), dur=900+Math.min(600,end*4);
    const step=now=>{if(!document.body.contains(el))return;const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=String(Math.round(end*e));if(p<1)requestAnimationFrame(step)};
    el.textContent="0"; requestAnimationFrame(step)});
}
const OC_RC={admin:"#F59E0B",teacher:"#818CF8",student:"#22D3EE",parent:"#F472B6"};
function ocHero(C,act){
  const total=C.mem.length, R=ROLE_ORDER.map(r=>[r,C.by[r]||0]);
  // donut
  const rad=52, circ=2*Math.PI*rad; let off=0;
  const arcs=total?R.filter(([,n])=>n).map(([r,n])=>{const len=n/total*circ, a=`<circle r="${rad}" cx="64" cy="64" fill="none" stroke="${OC_RC[r]}" stroke-width="14" stroke-dasharray="${Math.max(0,len-2).toFixed(2)} ${circ.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" stroke-linecap="butt"><title>${roleName(r)}: ${n}</title></circle>`;off+=len;return a}).join(""):"";
  // activity, last 14 days, from the audit log
  const days=[...Array(14)].map((_,i)=>{const d=new Date(TODAY);d.setDate(d.getDate()-13+i);return d}), per=days.map(()=>0);
  (S.audit||[]).forEach(a=>{const d=new Date(a.at);d.setHours(0,0,0,0);const i=Math.round((d-days[0])/864e5);if(i>=0&&i<14)per[i]++});
  const mx=Math.max(1,...per), sum=per.reduce((a,b)=>a+b,0);
  const bars=per.map((n,i)=>`<i style="height:${n?Math.max(10,n/mx*100):4}%" class="${n?"":"z"}${i===13?" now":""}" title="${days[i].toLocaleDateString(LOC(),{day:"numeric",month:"short"})}: ${n}"></i>`).join("");
  const newest=[...act].sort((a,b)=>(S.schools[b].createdAt||0)-(S.schools[a].createdAt||0))[0];
  return `<section class="oc-hero">
    <div class="oc-big"><small>${t("People on ClassLoad")}</small><b data-count="${total}">${total}</b><span>${t("across {n} active schools",{n:act.length})}</span>
      <ul class="oc-roles">${R.map(([r,n])=>`<li><i style="background:${OC_RC[r]}"></i>${roleName(r)}<b>${n}</b></li>`).join("")}</ul></div>
    <div class="oc-donut"><svg viewBox="0 0 128 128" role="img" aria-label="${t("People by role")}"><circle r="${rad}" cx="64" cy="64" fill="none" stroke="rgba(148,163,184,.15)" stroke-width="14"/><g transform="rotate(-90 64 64)">${arcs}</g></svg>
      <div><b data-count="${act.length}">${act.length}</b><small>${t("Schools")}</small></div></div>
    <div class="oc-spark"><small>${t("Activity, last 14 days")}</small><b data-count="${sum}">${sum}</b><div class="oc-sbars" aria-hidden="true">${bars}</div>
      <span>${newest?t("Newest school: {name}",{name:esc(S.schools[newest].name)}):t("No schools yet. Create the first one with “New school”.")}</span></div>
  </section>`;
}
function ocPalette(){
  if(document.getElementById("ocPal"))return;
  const O=S.oc, items=[
    ...[["overview",t("Overview")],["schools",t("Schools")],["users",t("Users")],["requests",t("Requests")],["activity",t("Activity")]].map(([k,l])=>({k:"tab",v:k,l,s:t("Section")})),
    {k:"new",l:t("New school"),s:t("Action")},
    ...schoolIds().map(id=>({k:"school",v:id,l:S.schools[id].name,s:(S.schools[id].city||t("School"))+(S.schools[id].archived?" · "+t("archived"):"")})),
    ...Object.entries(S.members).map(([uid,m])=>({k:"user",v:m.name||m.email||uid,l:m.name||m.email||"?",s:roleName(m.role)+(S.schools[m.school]?" · "+S.schools[m.school].name:"")}))];
  const w=document.createElement("div"); w.id="ocPal"; w.className="oc-pal";
  w.innerHTML=`<div class="oc-pal-box" role="dialog" aria-modal="true" aria-label="${t("Jump to anything")}"><div class="oc-pal-q"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="ocPalQ" type="search" autocomplete="off" placeholder="${t("Search schools, people and sections…")}" aria-label="${t("Search")}"><kbd>Esc</kbd></div><ul id="ocPalL" role="listbox"></ul></div>`;
  document.body.appendChild(w);
  const q=w.querySelector("#ocPalQ"), L=w.querySelector("#ocPalL"); let sel=0, shown=[];
  const close=()=>{w.remove();const b=document.getElementById("ocCmd");if(b)b.focus()};
  const go=it=>{close();if(!it)return;
    if(it.k==="tab"){O.tab=it.v;O.school=null}else if(it.k==="new"){O.tab="schools";O.school=null;O.newOpen=true}
    else if(it.k==="school"){O.tab="schools";O.school=it.v;O.stab="overview"}else if(it.k==="user"){O.tab="users";O.uq=it.v;O.urole="";O.usch=""}
    O.edit=null;O.del=null;render();toTop();if(it.k==="new"){const i=document.getElementById("nsName");if(i)i.focus()}};
  const draw=()=>{const v=q.value.trim().toLowerCase();shown=(v?items.filter(i=>(i.l+" "+i.s).toLowerCase().includes(v)):items).slice(0,9);sel=Math.min(sel,Math.max(0,shown.length-1));
    L.innerHTML=shown.length?shown.map((it,i)=>`<li role="option" aria-selected="${i===sel}" data-i="${i}"><span class="oc-pk ${it.k}">${it.k==="tab"?"§":it.k==="new"?"+":it.k==="school"?"▣":"●"}</span><b>${esc(it.l)}</b><small>${esc(it.s)}</small>${i===sel?"<kbd>↵</kbd>":""}</li>`).join(""):`<li class="oc-pal-none">${t("Nothing found")}</li>`;
    L.querySelectorAll("[data-i]").forEach(li=>{li.onmousemove=()=>{if(sel!==+li.dataset.i){sel=+li.dataset.i;draw()}};li.onclick=()=>go(shown[+li.dataset.i])})};
  q.oninput=()=>{sel=0;draw()};
  q.onkeydown=e=>{if(e.key==="ArrowDown"){e.preventDefault();sel=Math.min(shown.length-1,sel+1);draw()}else if(e.key==="ArrowUp"){e.preventDefault();sel=Math.max(0,sel-1);draw()}
    else if(e.key==="Enter"){e.preventDefault();go(shown[sel])}else if(e.key==="Escape"){e.preventDefault();close()}};
  w.onclick=e=>{if(e.target===w)close()};
  draw(); q.focus();
}
document.addEventListener("keydown",e=>{if(!document.body.classList.contains("oc-on"))return;
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test((e.target&&e.target.tagName)||"")||(e.target&&e.target.isContentEditable);
  if(((e.ctrlKey||e.metaKey)&&(e.key==="k"||e.key==="K"))||(e.key==="/"&&!typing)){e.preventDefault();ocPalette()}});
// ---- overview
function ocOverview(C,ids){
  const act=ids.filter(id=>!S.schools[id].archived), noAdmin=act.filter(id=>!sc0(C,id,"admin"));
  const recent=[...ids].sort((a,b)=>(S.schools[b].createdAt||0)-(S.schools[a].createdAt||0)).slice(0,5);
  const kpi=(n,l,go,tone)=>`<button class="kpi${tone?" "+tone:""}" ${go?`data-go="${go}"`:""}><b>${n}</b><span>${l}</span></button>`;
  const maxM=Math.max(1,...act.map(id=>ROLE_ORDER.reduce((s,r)=>s+sc0(C,id,r),0)));
  const chart=C.mem.length?`<section class="card oc-card"><div class="card-h"><h2>${t("People per school")}</h2><span class="legend-s">${ROLE_ORDER.map(r=>`<i class="lg ${r}"></i>${roleName(r)}`).join(" ")}</span></div>
    <ul class="oc-chart">${act.map(id=>{const tot=ROLE_ORDER.reduce((s,r)=>s+sc0(C,id,r),0);return `<li><span class="oc-chart-l">${esc(S.schools[id].name)}</span><span class="oc-bar" title="${tot}">${ROLE_ORDER.map(r=>sc0(C,id,r)?`<i class="${r}" style="width:${sc0(C,id,r)/maxM*100}%" title="${roleName(r)}: ${sc0(C,id,r)}"></i>`:"").join("")}</span><b>${tot}</b></li>`}).join("")}</ul></section>`:"";
  return `${ocHero(C,act)}<div class="kpis oc-kpis">
      ${kpi(act.length,t("Active schools")+(ids.length-act.length?` · ${ids.length-act.length} ${t("archived")}`:""),"schools")}
      ${kpi(C.by.admin||0,t("School admins"),"users:admin")}${kpi(C.by.teacher||0,t("Teachers"),"users:teacher")}${kpi(C.by.student||0,t("Students"),"users:student")}${kpi(C.by.parent||0,t("Parents"),"users:parent")}
      ${kpi(C.pendAdmin,t("Admin requests waiting"),"requests",C.pendAdmin?"bad":"")}${kpi(C.pend.length,t("All requests waiting"),"requests")}</div>
    ${noAdmin.length?`<div class="oc-alert"><b>${t("{n} schools have no admin yet",{n:noAdmin.length})}</b> · ${noAdmin.map(id=>`<button class="link" data-osch="${esc(id)}">${esc(S.schools[id].name)}</button>`).join(", ")}</div>`:""}
    <div class="oc-grid">
      <section class="card oc-card"><div class="card-h"><h2>${t("Recently created schools")}</h2><button class="link" data-go="schools">${t("All schools")}</button></div>
        ${recent.length?`<ul class="oc-list">${recent.map(id=>{const s=S.schools[id];return `<li><div><b>${esc(s.name)}</b><small>${esc(s.city||"")}${s.createdAt?(s.city?" · ":"")+fmtStamp(s.createdAt):""}${s.archived?" · "+t("archived"):""}</small></div><button class="sbtn" data-osch="${esc(id)}">${t("Open")}</button></li>`}).join("")}</ul>`:`<div class="empty">${t("No schools yet. Create the first one with “New school”.")}</div>`}</section>
      <section class="card oc-card"><div class="card-h"><h2>${t("Recent activity")}</h2><button class="link" data-go="activity">${t("Full log")}</button></div>
        ${S.audit.length?`<ul class="au-list">${S.audit.slice(0,8).map(auditLine).join("")}</ul>`:`<div class="empty">${t("Nothing recorded yet. Approvals, role changes and school changes will appear here.")}</div>`}</section>
    </div>
    ${chart}
    ${S.oldBook?`<section class="card oc-card"><h2>${t("Old class book data")}</h2><p class="hint">${t("The class book was removed. {n} old grades, absences and excuse notes are still stored. Delete them so no personal data is kept.",{n:S.oldBook})}</p>
      <button class="sbtn danger" id="delBook" ${S.deleting?"disabled":""}>${S.deleting?t("Deleting…"):t("Delete old class book data")}</button></section>`:""}`;
}
// ---- schools list

  const O=S.oc, q=O.q.trim().toLowerCase();
  const list=ids.filter(id=>{const s=S.schools[id];if(O.flt==="active"&&s.archived)return false;if(O.flt==="archived"&&!s.archived)return false;return !q||`${s.name} ${s.city}`.toLowerCase().includes(q)});
  const admins=id=>C.mem.filter(([,m])=>m.school===id&&m.role==="admin").map(([,m])=>m.name);
  const row=id=>{const s=S.schools[id], pend=C.pend.filter(([,r])=>r.school===id).length, ad=admins(id);
    if(O.edit===id)return `<li class="sch-row editing"><form class="sch-edit" data-editf="${esc(id)}"><input class="inp" name="sname" maxlength="60" value="${esc(s.name)}" aria-label="${t("School name")}" required><input class="inp" name="scity" maxlength="40" value="${esc(s.city)}" placeholder="${t("Town")}" aria-label="${t("Town")}"><button class="btn inline">${t("Save")}</button><button type="button" class="sbtn" data-editno="1">${t("Cancel")}</button></form></li>`;

      <div class="sch-id"><b>${esc(s.name)}</b><small>${esc(s.city||t("No town"))}${s.archived?` · <span class="tag">${t("Archived")}</span>`:""}</small></div>
      <div class="sch-ad"><small>${t("Admins")}</small><span>${ad.length?esc(ad.join(", ")):`<em class="bad-t">${t("None yet")}</em>`}</span></div>
      <div class="sch-n"><span><b>${sc0(C,id,"teacher")}</b>${t("teachers")}</span><span><b>${sc0(C,id,"student")}</b>${t("students")}</span><span><b>${sc0(C,id,"parent")}</b>${t("parents")}</span><span><b>${s.classes.length}</b>${t("classes")}</span>${pend?`<span class="hot"><b>${pend}</b>${t("waiting")}</span>`:""}</div>

          <button data-edit="${esc(id)}">${t("Edit name and town")}</button>
          ${s.archived?`<button data-restore="${esc(id)}">${t("Restore")}</button>`:`<button data-archive="${esc(id)}">${t("Archive")}</button>`}

  return `${O.newOpen||!ids.length?`<section class="card oc-card"><h2>${t("New school")}</h2><form class="form-row" id="nsForm"><input class="inp" id="nsName" placeholder="${t("School name, e.g. 119 SU")}" maxlength="60" value="${esc(S.newSchool.name)}" aria-label="${t("School name")}" required><input class="inp" id="nsCity" placeholder="${t("Town")}" maxlength="40" value="${esc(S.newSchool.city)}" aria-label="${t("Town")}"><button class="btn inline">${t("Create school")}</button>${ids.length?`<button type="button" class="sbtn" id="nsCancel">${t("Cancel")}</button>`:""}</form>
      <p class="fhint">${t("Then share an invite link so the principal can ask to become the school's admin, and approve them under Requests.")}</p></section>`:""}
    <div class="oc-tool"><div class="flt-q"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input class="inp sm" id="ocQ" type="search" placeholder="${t("Search by name or town")}" value="${esc(O.q)}" aria-label="${t("Search schools")}"></div>
      <div class="seg" role="group" aria-label="${t("Show")}">${[["active",t("Active")],["archived",t("Archived")],["all",t("All")]].map(([k,l])=>`<button data-sf="${k}" aria-pressed="${O.flt===k}">${l}</button>`).join("")}</div></div>
    ${list.length?`<ul class="sch-list">${list.map(row).join("")}</ul>`:`<div class="empty">${ids.length?t("No schools match."):t("No schools yet.")}</div>`}`;

function ocDelBox(id,C){
  const s=S.schools[id], O=S.oc, people=ROLE_ORDER.reduce((n,r)=>n+sc0(C,id,r),0), ok=O.delName.trim()===s.name;

// ---- one school's administration
function ocSchool(id,C){
  const O=S.oc, s=S.schools[id], mem=C.mem.filter(([,m])=>m.school===id), by=r=>mem.filter(([,m])=>m.role===r);
  const reqs=C.reqs.filter(([,r])=>r.school===id), pend=reqs.filter(([,r])=>isPending(r));
  const stabs=[["overview",t("Overview")],["staff",t("Teachers & staff")],["students",t("Students & parents")],["classes",t("Classes & subjects")],["requests",t("Requests"),pend.length],["settings",t("Settings")],["activity",t("Activity")]];
  let inner="";
  const subjects=[...new Set([...by("teacher").flatMap(([,m])=>m.teaches.map(p=>p.slice(0,p.lastIndexOf("|")))),...s.classes.flatMap(c=>{const tt=s.timetable&&s.timetable[c];return tt?TT_DAYS.flatMap(k=>tt[k]||[]).filter(Boolean):[]})])].sort((a,b)=>subj(a).localeCompare(subj(b),LOC()));
  if(O.stab==="staff")inner=ocPeopleTable(id,[...by("admin"),...by("teacher")],"staff");
  else if(O.stab==="students")inner=ocPeopleTable(id,[...by("student"),...by("parent")].sort((a,b)=>String(a[1].cls).localeCompare(String(b[1].cls),undefined,{numeric:true})||a[1].name.localeCompare(b[1].name,LOC())),"students");

async function ocSchoolUpdate(id,data,action,detail){try{await updateDoc(doc(db,"schools",id),{...data,updatedAt:Date.now()});logAudit(action,{school:id,detail});return true}catch(e){toast(failMsg(e));return false}}
function wireOwner(app,O){

  [["ocUR","urole"],["ocUS","usch"],["ocRS","rsch"],["ocAS","asch"]].forEach(([i,k])=>{const e=app.querySelector("#"+i);if(e)e.onchange=()=>{O[k]=e.value;render()}});

  app.querySelectorAll("[data-stab]").forEach(b=>b.onclick=()=>{O.stab=b.dataset.stab;O.del=null;O.peopleQ="";S.rejecting=null;render()});

    const nc=app.querySelector("#nsCancel"); if(nc)nc.onclick=()=>{O.newOpen=false;render()};
    nf.onsubmit=async e=>{e.preventDefault();const name=N.name.trim();if(!name)return toast(t("Type the school's name"));
      if(Object.values(S.schools).some(s=>s.name.trim().toLowerCase()===name.toLowerCase()&&(s.city||"").trim().toLowerCase()===N.city.trim().toLowerCase()))return toast(t("A school with this name and town already exists."));
      const btn=nf.querySelector("button.btn"); btn.disabled=true;
      try{const ref=await addDoc(collection(db,"schools"),{name:name.slice(0,60),city:N.city.trim().slice(0,40),classes:DEFAULT_CLASSES,createdAt:Date.now()});
        const sid=ref&&ref.id||(ref&&ref.path?ref.path.split("/")[1]:"");logAudit("school.create",{school:sid,schoolName:name,detail:N.city.trim()});
        S.newSchool={name:"",city:""};O.newOpen=false;S.page="owner";if(sid){O.tab="schools";O.school=sid;O.stab="overview"}render();toast(t("{name} added",{name}))}catch(err){toast(failMsg(err));btn.disabled=false}}}

// ---- export: CSV for Excel (UTF-8 with BOM, so Cyrillic opens correctly) and JSON for other systems
function download(name,text,type){
  try{const blob=new Blob([text],{type}),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast(t("Downloaded {name}",{name}))}
  catch(e){toast(t("Couldn't create the file."))}
}
const csvCell=v=>{v=String(v??"");if(/^[=+\-@]/.test(v))v="'"+v;return /[",\r\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
const toCSV=rows=>"﻿"+rows.map(r=>r.map(csvCell).join(",")).join("\r\n");
const fileSafe=s=>String(s).replace(/[^\wЀ-ӿ-]+/g,"_");
const tsISO=ms=>ms?new Date(ms).toISOString():"";

    students:studs.map(([u,m])=>({id:u,name:m.name,records:recs.filter(r=>r.student===u).map(r=>({id:r.id,date:r.date,subject:r.subject,kind:r.kind,
      ...(r.kind==="grade"?{grade:r.value}:{}),...(r.kind==="absence"?{absence:r.abs}:{}),note:r.note,teacher:r.byName,createdAt:tsISO(r.at),
      ...(r.excusedAt?{excusedAt:tsISO(r.excusedAt),excusedBy:r.excusedByName}:{}),...(r.void?{removed:true,removedAt:tsISO(r.voidAt),removedBy:r.voidByName}:{})}))}))};
  download(base+".json",JSON.stringify(out,null,2),"application/json");
}

// average grade per month, as bars on a 2–6 scale, with the overall average as a dashed line
function monthChart(grades){
  if(!grades.length)return "";
  const by={}; grades.forEach(r=>{const m=r.date.slice(0,7);(by[m]=by[m]||[]).push(r.value)});
  const months=Object.keys(by).sort().slice(-10), avgs=months.map(m=>by[m].reduce((a,b)=>a+b,0)/by[m].length);
  const all=avgOf(grades), W=Math.max(320,months.length*64+48), H=190, x0=36, top=18, bot=150, bw=Math.min(40,(W-x0-12)/months.length-16);
  const y=v=>bot-(v-2)/4*(bot-top), step=(W-x0-12)/months.length;

}

// ---- focus timer: start a study session from the study plan; it keeps counting across reloads
function focusStart(min,label){ls.set("cl-focus",JSON.stringify({end:Date.now()+min*6e4,min,label:String(label||"").slice(0,60)}));try{if(window.Notification&&Notification.permission==="default")Notification.requestPermission()}catch(e){}focusTick()}
function focusStop(){ls.set("cl-focus","");focusTick()}
var focusTimer=null;
function focusTick(){
  let f=null; try{f=JSON.parse(ls.get("cl-focus")||"null")}catch(e){}
  let el=document.getElementById("focusPill");
  if(!f||!S.user){if(el)el.remove();clearInterval(focusTimer);focusTimer=null;return}
  const left=Math.max(0,f.end-Date.now());
  if(left<=0){ls.set("cl-focus","");if(el)el.remove();clearInterval(focusTimer);focusTimer=null;
    toast(t("Session done. Take a 5-minute break."));try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
    try{if(window.Notification&&Notification.permission==="granted"&&document.hidden)new Notification("ClassLoad",{body:t("Session done. Take a 5-minute break."),icon:"icon-192.png"})}catch(e){}
    return}
  if(!el){el=document.createElement("div");el.id="focusPill";el.className="focus-pill";el.setAttribute("role","timer");document.body.appendChild(el)}
  const mm=Math.floor(left/6e4), ss=Math.floor(left%6e4/1e3);
  el.innerHTML=`<span class="dot" aria-hidden="true"></span><span><b>${mm}:${String(ss).padStart(2,"0")}</b><small>${esc(f.label||t("Focus"))}</small></span><button aria-label="${t("Stop")}" title="${t("Stop")}">✕</button>`;
  el.querySelector("button").onclick=focusStop;
  if(!focusTimer)focusTimer=setInterval(focusTick,1000);
}
async function aiAsk(intent,label){
  const A=S.ai; A.msgs.push({me:true,text:esc(label)}); A.busy=true; renderAI();
  let ans; try{ans=intent?await aiAnswer(intent,aiEntities(label)):S.llm.status==="loading"?{text:t("The AI is still loading ({p}%). Ask again when it's ready, and it will answer anything.",{p:Math.round(S.llm.progress*100)})}:{text:t("I didn't get that. Try one of these:")+(S.llm.status==="off"&&S.llm.model?" "+t("Or turn on the real AI above to ask anything."):""),chips:true}}catch(e){ans={text:failMsg(e)}}
  A.msgs.push({text:ans.text,acts:ans.acts||[],chips:ans.chips}); A.busy=false; if(A.msgs.length>30)A.msgs.splice(0,A.msgs.length-30); renderAI();
}
function renderAI(keep){
  hideAI(); return; // the AI assistant was removed from the app
  let fab=document.getElementById("aiFab"), pnl=document.getElementById("aiPanel");
  if(!S.user||!CUR||S.info||S.recordOf||(isOwner()&&S.page==="owner")){hideAI();return}
  if(!S.llm.checked&&!S.llm.queued){S.llm.queued=true;const go=()=>llmCheck();if(window.requestIdleCallback)requestIdleCallback(go,{timeout:4000});else setTimeout(go,1500)}
  if(!fab){fab=document.createElement("button");fab.id="aiFab";fab.className="ai-fab";document.body.appendChild(fab)}

  fab.classList.toggle("loading",LL.status==="loading"); fab.setAttribute("aria-expanded",String(S.ai.open)); fab.hidden=S.ai.open;
  fab.onclick=()=>{S.ai.open=true;llmCheck();renderAI();const i=document.getElementById("aiQ");if(i&&window.innerWidth>640)i.focus()};

  pnl.hidden=!S.ai.open; if(!S.ai.open)return;

    :`<div class="ai-msg bot">${S.llm.status==="ready"?t("Hi! Ask me anything: homework help, explanations, writing, maths, fun facts, or your class plan."):t("Hi! I can help with your class plan. Tap a question or type your own.")}</div>`;

    :L0.status==="loading"?`<div class="llm-card"><b>${t("Loading the AI…")} <span id="llmTxt">${Math.round(L0.progress*100)}%</span></b><div class="meter"><b id="llmBar" style="width:${Math.round(L0.progress*100)}%;background:var(--accent)"></b></div><p>${t("The first time takes a few minutes. Next time it opens from the device in seconds.")}</p></div>`
    :L0.status==="error"?`<div class="llm-card bad"><b>${t("The AI couldn't start on this device.")}</b><p>${esc(L0.err||"")}</p><p>${t("Quick answers below still work.")}</p><button class="sbtn" id="llmOn">${t("Try again")}</button></div>`
    :L0.status==="unsupported"&&!A.msgs.length?`<div class="llm-card"><p>${t("This browser can't run the AI model (it needs WebGPU: Chrome or Edge on a computer, or a recent phone). Quick answers below still work.")}</p></div>`:"";
  const keepTop=keep&&pnl.querySelector("#aiBody")?pnl.querySelector("#aiBody").scrollTop:null;
  pnl.innerHTML=`<header class="ai-head"><span class="ai-ic">${AI_ICON}</span><div><b>${t("Assistant")}${ready?` <span class="ai-badge">AI</span>`:""}</b><small>${ready?t("AI on your device · nothing leaves it"):L0.status==="unsupported"?t("Quick answers · AI needs WebGPU (Chrome/Edge)"):t("Works only with ClassLoad's data, on your device")}</small></div>${ready?`<button class="ai-x" id="llmOff" title="${t("Turn off AI")}" aria-label="${t("Turn off AI")}">⏻</button>`:""}<button class="ai-x" id="aiClose" aria-label="${t("Close")}">✕</button></header>
    ${["off","ready","error"].includes(L0.status)&&L0.model?`<div class="ai-tools"><label for="llmTier">${t("AI model")}</label><select class="inp sm" id="llmTier">${llmTiers().map(k=>`<option value="${k}"${k===L0.tier?" selected":""}>${t(LLM_TIERS[k].name)} · ${LLM_TIERS[k].size}</option>`).join("")}</select>${A.msgs.length?`<button class="sbtn" id="aiNew">${t("New chat")}</button>`:""}</div>`:L0.status==="loading"&&L0.tier?`<div class="ai-tools"><small>${t("Loading the {m} model…",{m:t(LLM_TIERS[L0.tier].name)})}</small></div>`:""}

function renderInfo(app){
  const L=LANG==="bg"?"bg":"en";
  const back=`<button class="back info-back" id="infoBack">← ${t("Back")}</button>`;
  if(S.info==="help"){
    const myRole=CUR?CUR.role:null, sec=HELP[L];
    const openId=myRole==="student"?"student":myRole==="parent"?"parent":myRole==="teacher"?"teacher":myRole==="admin"?"teacher":"start";
    app.innerHTML=`<div class="info">${back}<header class="info-head"><h1>${t("Help")}</h1><p>${t("Short guides for every role. Tap a topic to open it.")}</p></header>
      <nav class="info-nav" aria-label="${t("Topics")}">${sec.map(s=>`<a href="#h-${s.id}">${esc(s.title)}</a>`).join("")}</nav>
      ${sec.map(s=>`<details class="info-sec" id="h-${s.id}"${s.id===openId?" open":""}><summary>${esc(s.title)}</summary><dl>${s.items.map(([q,a])=>`<dt>${esc(q)}</dt><dd>${esc(a)}</dd>`).join("")}</dl></details>`).join("")}
      <p class="hint">${t("Still stuck? Ask your school's ClassLoad admin.")}</p></div>`;
    app.querySelectorAll(".info-nav a").forEach(a=>a.onclick=e=>{e.preventDefault();const d=app.querySelector(a.getAttribute("href"));if(d){d.open=true;d.scrollIntoView({behavior:"smooth",block:"start"})}});
  } else {
    const P=PRIVACY[L];
    const ownerMail=S.ownerDoc&&S.ownerDoc.email?` (${esc(S.ownerDoc.email)})`:"";
    const canDelete=S.user&&!isOwner();
    app.innerHTML=`<div class="info">${back}<header class="info-head"><h1>${t("Privacy")}</h1><p>${esc(P.intro)}</p></header>
      ${P.sections.map(([h,list])=>`<section class="info-card"><h2>${esc(h)}</h2><ul>${list.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></section>`).join("")}
      <section class="info-card"><h2>${t("Delete my data")}</h2>
        ${canDelete?`<p class="hint">${t("This removes your account details, class membership, ticks, reminders and any pending request from ClassLoad. Tasks teachers created stay with the class.")}</p>
          ${deleteArmed?`<div class="del-confirm"><p><b>${t("Delete all your ClassLoad data?")}</b> ${t("You'll need to ask to join your school again. This can't be undone.")}</p>
            <div class="acts"><button class="sbtn danger" id="delMe" ${deleting?"disabled":""}>${deleting?t("Deleting…"):t("Yes, delete my data")}</button><button class="sbtn" id="delNo" ${deleting?"disabled":""}>${t("Cancel")}</button></div></div>`
          :`<button class="sbtn no" id="delArm">${t("Delete my data")}</button>`}`
        :S.user?`<p class="hint">${t("You're the owner. To remove everything, delete the schools in the Owner console, or the whole project in Firebase.")}</p>`
        :`<p class="hint">${t("Sign in first to delete your data.")}</p>`}
      </section>
      <p class="hint">${P.contact.replace("{owner}",ownerMail)}</p></div>`;
    const da=app.querySelector("#delArm"); if(da)da.onclick=()=>{deleteArmed=true;renderInfo(app)};
    const dn=app.querySelector("#delNo"); if(dn)dn.onclick=()=>{deleteArmed=false;renderInfo(app)};
    const dm=app.querySelector("#delMe"); if(dm)dm.onclick=deleteMyData;
  }
  app.querySelector("#infoBack").onclick=closeInfo;
}
async function deleteMyData(){
  if(!S.user||isOwner()||deleting)return;
  deleting=true; render();
  const uid=S.user.uid; let failed=false;
  if(R.state==="on"){ls.set("cl-push",null);R.state="off"}
  try{const ws=await getDocs(query(collection(db,"work"),where("student","==",uid)));for(const d of ws.docs)await deleteDoc(d.ref)}catch(e){failed=true}
  for(const c of ["tokens","progress","requests","members"]){try{await deleteDoc(doc(db,c,uid))}catch(e){failed=true}}
  deleting=false; deleteArmed=false;
  if(failed){toast(t("Some data couldn't be deleted. Ask your school's admin to remove you."));render();return}
  toast(t("Your data was deleted"));
  S.hadReq=false; S.info=null; await signOut(auth);
}

// ================= interactive hover buttons =================
// Every action button gets the same hover: the label slides away, the dot grows to fill the button and the label returns with an arrow.
const IHB_SEL=".btn,.sbtn,.auth-btn,.auth-g,.add-btn";
const IHB_SKIP=".seg,.types,.oc-tabs,.oc-subtabs,.nav-mob,.mm,.more-menu summary";
const IHB_ARROW='<svg class="ihb-arr" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>';
function ihbOne(b){
  if(b.firstElementChild&&b.firstElementChild.classList.contains("ihb-dot"))return;
  if(b.closest(IHB_SKIP)||!b.textContent.trim())return;
  const a=document.createElement("span"); a.className="ihb-a"; while(b.firstChild)a.appendChild(b.firstChild);
  const c=document.createElement("span"); c.className="ihb-b"; c.setAttribute("aria-hidden","true"); c.innerHTML=a.innerHTML+IHB_ARROW;
  c.querySelectorAll("[id]").forEach(e=>e.removeAttribute("id"));
  const d=document.createElement("span"); d.className="ihb-dot"; d.setAttribute("aria-hidden","true");
  b.append(d,a,c); b.classList.add("ihb");
}
let ihbQ=0;
function ihbAll(){ihbQ=0;document.querySelectorAll(IHB_SEL).forEach(b=>{if(b.tagName==="BUTTON"||b.tagName==="A")ihbOne(b)})}
try{ihbAll();new MutationObserver(()=>{if(!ihbQ)ihbQ=(window.requestAnimationFrame||setTimeout)(ihbAll)}).observe(document.body,{childList:true,subtree:true})}catch(e){}
