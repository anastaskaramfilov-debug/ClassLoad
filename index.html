<style>
/* ClassLoad: a calm, professional school tool.
   System font, neutral greys, thin borders, one blue accent. Green/amber/red appear only as small status signals. */
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#f7f8fa; --ink:#1f2328; --muted:#5d6470; --line:#e1e4e9; --line-2:#cdd2d9;
  --accent:#0f6cbd; --accent-hover:#0c5aa0; --accent-ink:#ffffff; --accent-soft:#eaf2fb;
  --ok:#1a7f37; --ok-bar:#2da44e; --ok-soft:#eaf6ed;
  --warn:#8a5d00; --warn-bar:#d29c1f; --warn-soft:#fdf5e1;
  --bad:#c4314b; --bad-bar:#d1384f; --bad-soft:#fcecef;
  --s-maths:#3b5bdb; --s-bulgarian:#c2551a; --s-english:#0b7a8a; --s-biology:#2f8a3a; --s-chemistry:#9c36b5;
  --s-physics:#1c6fd1; --s-history:#9a6412; --s-geography:#13836f; --s-it:#475569; --s-other:#7a828e;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-head:var(--font); --f-display:var(--font); --f-body:var(--font); --f-mono:var(--font);
  --r:8px; --shadow:0 1px 2px rgba(16,24,40,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15171b; --surface:#1d2026; --surface-2:#23272e; --ink:#e6e8eb; --muted:#9aa2ad; --line:#30353e; --line-2:#3d434d;
  --accent:#4da3ff; --accent-hover:#74b7ff; --accent-ink:#0d1520; --accent-soft:#1b2b40;
  --ok:#57c675; --ok-bar:#3fb860; --ok-soft:#18301f;
  --warn:#e2b54a; --warn-bar:#d6a637; --warn-soft:#352b14;
  --bad:#ff8193; --bad-bar:#e05468; --bad-soft:#3a1f25;
  --s-maths:#8ea2ff; --s-bulgarian:#ff9d6b; --s-english:#5fcbdc; --s-biology:#7ccf86; --s-chemistry:#d690e8;
  --s-physics:#7fb3ff; --s-history:#ddb06a; --s-geography:#62d0b8; --s-it:#aab3bf; --s-other:#a7aeb8;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15171b; --surface:#1d2026; --surface-2:#23272e; --ink:#e6e8eb; --muted:#9aa2ad; --line:#30353e; --line-2:#3d434d;
  --accent:#4da3ff; --accent-hover:#74b7ff; --accent-ink:#0d1520; --accent-soft:#1b2b40;
  --ok:#57c675; --ok-bar:#3fb860; --ok-soft:#18301f;
  --warn:#e2b54a; --warn-bar:#d6a637; --warn-soft:#352b14;
  --bad:#ff8193; --bad-bar:#e05468; --bad-soft:#3a1f25;
  --s-maths:#8ea2ff; --s-bulgarian:#ff9d6b; --s-english:#5fcbdc; --s-biology:#7ccf86; --s-chemistry:#d690e8;
  --s-physics:#7fb3ff; --s-history:#ddb06a; --s-geography:#62d0b8; --s-it:#aab3bf; --s-other:#a7aeb8;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}

/* ---------- base ---------- */
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;padding:0 16px;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
img{max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding-block:0 32px;display:flex;flex-direction:column;gap:18px}
.mono{font-family:var(--font)}
h1,h2,h3,h4{text-wrap:balance}
.loading{padding:80px 0;text-align:center;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:0}
.hint.small{font-size:12px}
.fine{font-size:12px;color:var(--muted);margin:0}
.empty{padding:20px;border:1px dashed var(--line-2);border-radius:var(--r);color:var(--muted);text-align:center;font-size:13px}
.link{border:0;background:transparent;padding:0;color:var(--accent);font-weight:600;font-size:13px}
.link:hover{text-decoration:underline}
.danger-link{color:var(--bad);align-self:flex-start}
.ic-s{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2px}

/* ---------- app bar ---------- */
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;margin:0 -16px;border-bottom:1px solid var(--line);background:var(--surface)}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.logo-mark{width:26px;height:26px;border-radius:6px;background:var(--accent);display:grid;grid-template-columns:repeat(3,1fr);align-items:end;gap:2px;padding:6px}
.logo-mark i{display:block;border-radius:1px;background:#ffffff}
.logo-mark i:nth-child(1){height:5px;opacity:.75} .logo-mark i:nth-child(2){height:9px;opacity:.88} .logo-mark i:nth-child(3){height:14px}
.bar-right{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.chip-btn,.install-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:6px;padding:5px 10px;font-weight:600;font-size:12px;height:30px}
.chip-btn:hover{background:var(--surface-2)}
.chip-lbl{color:var(--muted);font-weight:500}
.install-btn{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
@media (max-width:560px){.chip-lbl{display:none}}
.who{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding-left:8px;border-left:1px solid var(--line)}
.who button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 10px;font-size:12px;font-weight:600;height:30px}
.who button:hover{background:var(--surface-2)}
.me-av{width:26px;height:26px;border-radius:50%}
.me-name{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:560px){.me-name{display:none}.who{border-left:0;padding-left:0}}
.who .role{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--accent-soft);color:var(--accent)}
.who .role.student,.who .role.parent{background:var(--ok-soft);color:var(--ok)}
.who .role.admin,.who .role.owner{background:var(--warn-soft);color:var(--warn)}

/* ---------- sign-in & onboarding ---------- */
.gate{min-height:calc(100vh - 140px);display:grid;place-items:center;padding-block:28px}
.gate-card{width:100%;max-width:860px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 8px 24px -12px rgba(16,24,40,.12)}
@media (max-width:760px){.gate-card{grid-template-columns:1fr}}
.gate-side{padding:36px 32px;display:flex;flex-direction:column;justify-content:space-between;gap:28px;background:var(--surface-2);border-right:1px solid var(--line)}
@media (max-width:760px){.gate-side{border-right:0;border-bottom:1px solid var(--line)}}
.gate-side h1{margin:0;font-weight:700;font-size:28px;line-height:1.2;letter-spacing:-.01em}
.gate-side p{margin:0;color:var(--muted);max-width:34ch;font-size:14px}
.mini-strip{display:flex;align-items:end;gap:6px;height:72px;border-bottom:1px solid var(--line-2)}
.mini-strip i{flex:1;border-radius:3px 3px 0 0}
.mini-strip i[style*="--ok"]{background:var(--ok-bar)!important} .mini-strip i[style*="--warn"]{background:var(--warn-bar)!important} .mini-strip i[style*="--bad"]{background:var(--bad-bar)!important}
.gate-main{padding:36px 32px;display:flex;flex-direction:column;gap:16px}
.gate-main h2{margin:0;font-weight:700;font-size:22px;letter-spacing:-.01em}
.acct{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.acct img{width:28px;height:28px;border-radius:50%}
.acct strong{color:var(--ink)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:10px 16px;font-weight:600;font-size:14px}
.gbtn:hover{background:var(--surface-2)}
.gbtn:disabled{opacity:.6;cursor:wait}
.or{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted)}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.email-row{display:flex;gap:8px;flex-wrap:wrap}
.email-row input{flex:1;min-width:180px}
.gate-msg{border-radius:6px;padding:10px 12px;font-size:13px;background:var(--surface-2);border:1px solid var(--line)}
.gate-msg strong{display:block;margin-bottom:2px}
.gate-msg.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 25%,transparent)}
.gate-msg.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 25%,transparent)}
.steps{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);font-weight:600}
.steps i{width:24px;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--accent)}
.school-list{display:flex;flex-direction:column;max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:var(--r)}
.school-list button{display:flex;justify-content:space-between;align-items:center;gap:10px;border:0;border-bottom:1px solid var(--line);background:var(--surface);padding:11px 14px;text-align:left}
.school-list button:last-child{border-bottom:0}
.school-list button:hover{background:var(--surface-2)}
.school-list button[aria-pressed="true"]{background:var(--accent-soft)}
.school-list b{font-weight:600;font-size:14px}
.school-list span{font-size:12px;color:var(--muted)}
.doors{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.doors.three{grid-template-columns:repeat(3,1fr)}
@media (max-width:420px){.doors,.doors.three{grid-template-columns:1fr}}
.door{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:3px}
.door:hover{border-color:var(--line-2);background:var(--surface-2)}
.door[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.door .ic{width:32px;height:32px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;margin-bottom:6px}
.door .ic svg{width:18px;height:18px;stroke:var(--accent);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.door b{font-size:14px;font-weight:600}
.door span{font-size:12px;color:var(--muted)}
.back{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13px;padding:0;align-self:flex-start}
.back:hover{color:var(--ink)}
.class-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:6px}
.class-grid button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:9px 4px;font-weight:600;font-size:14px}
.class-grid button:hover{background:var(--surface-2)}
.class-grid button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.wait{display:flex;flex-direction:column;align-items:flex-start;gap:14px}
.wait .pulse{width:40px;height:40px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin 1.1s linear infinite}
.wait .pulse i{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:13px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}

/* ---------- inputs & buttons ---------- */
.field{display:flex;flex-direction:column;gap:5px}
.field>label,.flabel{font-size:12px;font-weight:600;color:var(--muted)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
select.inp,input.inp,.inp{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:6px;padding:7px 10px;min-width:0;width:100%;height:36px}
.inp:hover{border-color:var(--muted)}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.btn{border:1px solid var(--accent);border-radius:6px;padding:9px 16px;font-weight:600;font-size:14px;background:var(--accent);color:var(--accent-ink);width:100%;min-height:38px}
.btn:not(:disabled):hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn:disabled{background:var(--surface-2);border-color:var(--line);color:var(--muted);cursor:not-allowed}
.btn.inline{width:auto}
.btn.good{background:var(--accent);border-color:var(--accent)}
.btn.warn{background:var(--surface);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn.warn:not(:disabled):hover{background:var(--bad-soft);border-color:var(--bad)}
.btn-row{display:flex;gap:8px;align-items:center}
.btn-row .btn{flex:1}
.sbtn{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:5px 11px;font-weight:600;font-size:12px;min-height:30px}
.sbtn:hover{background:var(--surface-2)}
.sbtn.yes{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sbtn.yes:hover{background:var(--accent-hover)}
.sbtn.no:hover{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:var(--bad-soft)}
.sbtn.danger{background:var(--bad-bar);border-color:var(--bad-bar);color:#ffffff}
.sbtn:disabled{opacity:.6;cursor:wait}
.badge{font-size:11px;font-weight:600;padding:1px 7px;margin-left:6px;border-radius:10px;background:var(--ok-soft);color:var(--ok)}
.count{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--bad-bar);color:#ffffff;font-size:11px;font-weight:700;padding:0 5px;margin-left:6px}

/* ---------- class header ---------- */
.hero{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:20px 24px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:32px;align-items:end}
.hero>*{min-width:0}
@media (max-width:860px){.hero{grid-template-columns:1fr;gap:20px;padding:18px}}
.hero-left{display:flex;flex-direction:column;gap:10px}
.school-pill{font-size:13px;color:var(--muted);font-weight:500}
.school-select{align-self:flex-start;border:1px solid var(--line-2);border-radius:6px;background:var(--surface);color:var(--ink);padding:4px 8px;font:inherit;font-size:13px;font-weight:600;height:30px}
.cls-block{display:flex;flex-direction:column;gap:2px}
.class-pick{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.class-pick label,.class-pick .lbl{font-size:12px;font-weight:600;color:var(--muted)}
.add-class{border:0;background:transparent;color:var(--accent);font-size:12px;font-weight:600;padding:0}
.add-class:hover{text-decoration:underline}
.class-select,.class-fixed{appearance:none;background:transparent;border:0;color:var(--ink);font-family:var(--font);font-weight:700;font-size:34px;line-height:1.15;letter-spacing:-.02em;padding:0}
.class-select{align-self:flex-start;padding-right:28px;cursor:pointer;border-radius:6px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 12px) 55%,calc(100% - 6px) 55%;background-size:6px 6px;background-repeat:no-repeat}
.class-select:hover{background-color:var(--surface-2)}
.class-select option{font-size:14px;font-weight:400;color:#1f2328;background:#ffffff}
.newclass{display:flex;gap:8px;margin-top:6px}
.newclass input{border:1px solid var(--line-2);border-radius:6px;padding:6px 10px;width:120px;font:inherit;background:var(--surface);color:var(--ink)}
.newclass button{border:1px solid var(--accent);border-radius:6px;padding:6px 12px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.verdict{display:flex;flex-direction:column;gap:4px;padding-top:12px;border-top:1px solid var(--line)}
.verdict .lead{font-weight:600;font-size:16px;line-height:1.35}
.verdict .lead em{font-style:normal;font-weight:700}
.verdict .lead em.ok{color:var(--ok)} .verdict .lead em.warn{color:var(--warn)} .verdict .lead em.bad{color:var(--bad)}
.verdict p{margin:0;color:var(--muted);font-size:13px;max-width:60ch}
/* forecast chart */
.fc{display:flex;flex-direction:column;min-width:0}
.strip-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;font-size:12px;font-weight:600;color:var(--muted)}
.strip-head span:last-child{font-weight:400}
.fc-plot{position:relative;height:128px;border-bottom:1px solid var(--line-2);background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/100% 25%}
.fc-bars{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px;align-items:end;z-index:1}
.fc .col{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;border:0;background:transparent;padding:0;border-radius:4px 4px 0 0}
.fc .col:hover{background:var(--surface-2)}
.fc .barv{display:block;width:100%;max-width:40px;position:relative;border-radius:3px 3px 0 0;transition:height .4s cubic-bezier(.2,.8,.2,1)}
.fc .barv.ok{background:var(--ok-bar)} .fc .barv.warn{background:var(--warn-bar)} .fc .barv.bad{background:var(--bad-bar)}
.fc .barv.zero{background:var(--line)}
.fc .barv span{position:absolute;top:-19px;left:0;right:0;text-align:center;font-weight:600;font-size:11px;color:var(--ink)}
.fc .col.inview{background:var(--accent-soft)}
.fc-limit{position:absolute;left:0;right:0;border-top:1px dashed var(--bad);z-index:2;pointer-events:none}
.fc-limit span{position:absolute;right:0;top:-17px;font-size:11px;font-weight:600;color:var(--bad);line-height:1;background:var(--surface);padding:0 2px 0 6px}
.fc-labels{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px;margin-top:6px;font-size:11px;color:var(--muted);text-align:center;white-space:nowrap}
.fc-labels span{overflow:hidden;text-overflow:ellipsis}
.fc-labels .on{color:var(--accent);font-weight:600}
@media (max-width:860px){.fc-plot{height:108px}.fc-bars,.fc-labels{gap:6px}}

/* ---------- workspace ---------- */
.notice{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 25%,transparent);border-radius:var(--r);padding:10px 14px;font-size:13px}
.preview-bar{background:var(--ok-soft);border:1px solid color-mix(in srgb,var(--ok) 25%,transparent);border-radius:var(--r);padding:10px 14px;font-size:13px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.preview-bar.edit{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.work{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;align-items:start}
@media (max-width:980px){.work{grid-template-columns:1fr}}
.board-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.board-head h2{margin:0;font-weight:700;font-size:16px}
.nav{display:flex;gap:0;border:1px solid var(--line-2);border-radius:6px;overflow:hidden;background:var(--surface)}
.nav button{border:0;border-right:1px solid var(--line-2);background:transparent;padding:5px 12px;font-weight:600;font-size:12px;height:30px}
.nav button:last-child{border-right:0}
.nav button:hover{background:var(--surface-2)}
.board{display:flex;flex-direction:column;gap:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:12px;align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.legend i[style*="--ok"]{background:var(--ok-bar)!important} .legend i[style*="--warn"]{background:var(--warn-bar)!important} .legend i[style*="--bad"]{background:var(--bad-bar)!important}
/* week */
.week{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--shadow)}
.week.current{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.week-head{display:grid;grid-template-columns:auto minmax(60px,1fr) auto auto;align-items:center;gap:14px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.week-head h3{margin:0;font-weight:600;font-size:14px;white-space:nowrap}
.week-head h3 small{font-weight:600;font-size:11px;color:var(--accent);margin-left:8px;background:var(--accent-soft);padding:1px 7px;border-radius:10px}
@media (max-width:560px){.week-head{grid-template-columns:1fr auto auto}.week-head .meter{grid-column:1/-1;order:3}}
.meter{height:6px;border-radius:3px;background:var(--line);display:flex;overflow:hidden}
.meter b{display:block;height:100%;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.meter b[style*="--ok"]{background:var(--ok-bar)!important} .meter b[style*="--warn"]{background:var(--warn-bar)!important} .meter b[style*="--bad"]{background:var(--bad-bar)!important}
.meter b.add{background:repeating-linear-gradient(-45deg,var(--accent) 0 3px,color-mix(in srgb,var(--accent) 35%,transparent) 3px 6px)}
.pts{font-size:12px;color:var(--muted);white-space:nowrap}
.pts strong{color:var(--ink);font-size:14px;font-weight:700}
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.day{position:relative;min-height:104px;padding:8px 8px 10px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:5px;min-width:0}
.day:last-child{border-right:0}
.dhead{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em;margin-bottom:2px}
.dhead .num{order:-1;font-weight:600;font-size:14px;color:var(--ink);line-height:1;min-width:26px;height:26px;display:grid;place-items:center;border-radius:50%;letter-spacing:0;text-transform:none}
.day.today .dhead .num{background:var(--accent);color:var(--accent-ink)}
.day.today .dhead{color:var(--accent)}
.day.past{background:var(--surface-2)}
.day.past .dhead,.day.past .dhead .num{color:var(--muted)}
.day.pickable{cursor:pointer}
.day.pickable:hover{background:var(--surface-2)}
.day.picked,.day.drop{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.day.suggest{box-shadow:inset 0 0 0 2px var(--ok-bar)}
.plus{margin-top:auto;font-size:12px;font-weight:600;color:var(--accent);opacity:0;transition:opacity .12s;text-align:center;border:1px dashed color-mix(in srgb,var(--accent) 50%,transparent);border-radius:4px;padding:3px}
.day.pickable:hover .plus,.day.picked .plus{opacity:1}
@media (max-width:640px){.days{grid-template-columns:1fr}.day{border-right:0;border-bottom:1px solid var(--line);min-height:0;padding:8px 12px}.day:last-child{border-bottom:0}.plus{display:none}}
/* task = calendar event */
.task{position:relative;font-size:12px;line-height:1.3;padding:5px 7px 5px 9px;background:color-mix(in srgb,var(--sc) 9%,var(--surface));border-radius:4px;display:flex;flex-direction:column;gap:1px;min-width:0;border:1px solid color-mix(in srgb,var(--sc) 18%,transparent)}
.task::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:4px 0 0 4px;background:var(--sc,var(--muted))}
.task .t1{display:flex;align-items:center;justify-content:space-between;gap:6px;font-weight:600;font-size:12.5px}
.task .t1 span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task .kind{font-size:10px;font-weight:700;padding:0 5px;border-radius:3px;white-space:nowrap;letter-spacing:.02em;line-height:16px}
.kind.k1{background:var(--ok-soft);color:var(--ok)} .kind.k2{background:var(--warn-soft);color:var(--warn)} .kind.k3,.kind.k5{background:var(--bad-soft);color:var(--bad)}
.task small{color:var(--muted);font-size:11.5px;overflow-wrap:anywhere}
.task .meta{display:flex;gap:8px;align-items:center}
.task.ghost{border:1px dashed var(--accent);background:var(--accent-soft)}
.task.ghost::before{background:var(--accent)}
.task.editable{cursor:pointer}
.task.editable:hover{border-color:color-mix(in srgb,var(--sc) 45%,transparent);box-shadow:0 1px 3px rgba(16,24,40,.1)}
.task.dragging{opacity:.4}
.task.done{opacity:.55}
.task.done .t1 span:first-child{text-decoration:line-through}
.task .rm{position:absolute;right:3px;bottom:3px;border:1px solid var(--line-2);background:var(--surface);border-radius:4px;font-size:10px;font-weight:700;color:var(--muted);padding:0 5px;opacity:0;line-height:16px}
.task:hover .rm,.task .rm:focus-visible,.task .rm.armed{opacity:1}
.task .rm.armed{background:var(--bad-bar);border-color:var(--bad-bar);color:#ffffff}
.mat{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:600;font-size:11.5px;text-decoration:none}
.mat:hover{text-decoration:underline}

/* ---------- side panel ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:0 18px 18px;display:flex;flex-direction:column;gap:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px)}
@media (min-width:981px){.panel{max-height:calc(100vh - 28px);overflow:auto;overscroll-behavior:contain}}
@media (max-width:980px){.panel{position:static}}
.panel>h2:first-child{margin-top:18px}
.panel h2{margin:0;font-weight:700;font-size:18px;letter-spacing:-.01em}
.panel .sub{margin:-12px 0 0;color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 -18px;padding:0 14px;position:sticky;top:0;background:var(--surface);z-index:3}
.tabs button{border:0;background:transparent;padding:12px 8px 10px;margin-bottom:-1px;font-weight:600;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.edit-note{margin:0;font-size:13px;color:var(--accent);font-weight:600}
.types{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line-2);border-radius:6px;overflow:hidden}
.types button{border:0;border-right:1px solid var(--line-2);background:var(--surface);padding:7px 2px;display:flex;flex-direction:column;align-items:center;gap:0;font-size:12px;font-weight:600;color:var(--ink)}
.types button:last-child{border-right:0}
.types button:hover{background:var(--surface-2)}
.types button b{font-size:15px;font-weight:700;line-height:1.2}
.types button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.impact{border:1px solid var(--line);border-left-width:3px;border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--surface-2)}
.impact.ok{border-left-color:var(--ok-bar);background:var(--ok-soft)} .impact.warn{border-left-color:var(--warn-bar);background:var(--warn-soft)} .impact.bad{border-left-color:var(--bad-bar);background:var(--bad-soft)}
.impact h4{margin:0;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;line-height:1.3}
.impact h4 span[aria-hidden]{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font-size:11px;color:#ffffff;background:var(--muted)}
.impact.ok h4{color:var(--ok)} .impact.ok h4 span[aria-hidden]{background:var(--ok-bar)}
.impact.warn h4{color:var(--warn)} .impact.warn h4 span[aria-hidden]{background:var(--warn-bar)}
.impact.bad h4{color:var(--bad)} .impact.bad h4 span[aria-hidden]{background:var(--bad-bar)}
.impact .best-h{color:var(--ink)!important}
.impact p{margin:0;font-size:13px}
.impact .idle{color:var(--muted)}
.ba{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:600}
.ba .meter{flex:1;background:color-mix(in srgb,var(--ink) 10%,transparent)}
.sugs{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:6px;background:var(--surface);overflow:hidden}
.sug{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;border-bottom:1px solid var(--line);background:var(--surface);padding:8px 12px;text-align:left;font-weight:600;font-size:13px}
.sug:last-child{border-bottom:0}
.sug:hover{background:var(--accent-soft)}
.sug span{font-size:12px;font-weight:500;color:var(--muted)}
.sug.meh span{color:var(--warn)}
.more{border:1px solid var(--line);border-radius:6px;padding:0 12px}
.more summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;padding:9px 0;font-size:13px;font-weight:600}
.more summary::-webkit-details-marker{display:none}
.more summary::after{content:"";width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg) translateY(-2px);transition:transform .15s}
.more[open] summary::after{transform:rotate(-135deg) translateY(-2px)}
.more-body{display:flex;flex-direction:column;gap:12px;padding-bottom:12px}
.save-bar{position:sticky;bottom:-18px;margin:0 -18px -4px;padding:12px 18px 16px;background:var(--surface);border-top:1px solid var(--line);z-index:2;display:flex;flex-direction:column;gap:8px}
.tools{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stats div{padding:10px 12px;border-right:1px solid var(--line)}
.stats div:last-child{border-right:0}
.stats b{display:block;font-size:22px;line-height:1.1;font-weight:700}
.stats span{font-size:11px;color:var(--muted)}
.progress{display:flex;flex-direction:column;gap:6px}
.progress-top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.progress-top b{color:var(--ink)}
.progress .meter b{background:var(--ok-bar)!important}
.next{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.next>li{display:flex;flex-direction:column;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.next>li:last-child{border-bottom:0}
.next li .row{display:flex;align-items:center;gap:10px;min-width:0}
.next .cd{width:40px;flex:none;text-align:center;line-height:1.1}
.next .cd b{display:block;font-size:18px;font-weight:700}
.next .cd small{font-size:11px;color:var(--muted)}
.next .what{flex:1;min-width:0}
.next .what strong{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600}
.next .what strong i{width:8px;height:8px;border-radius:2px;background:var(--sc);flex:none}
.next .what small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.next li.done .what strong{text-decoration:line-through;color:var(--muted)}
.chk{width:20px;height:20px;flex:none;border-radius:4px;border:1.5px solid var(--line-2);background:var(--surface);color:#ffffff;font-weight:800;font-size:12px;display:grid;place-items:center;padding:0;line-height:1}
.chk:hover{border-color:var(--accent)}
.chk.on{background:var(--accent);border-color:var(--accent)}
.extras{display:flex;gap:16px;align-items:center;padding-left:50px}
.plan{margin:0 0 0 50px;padding:8px 12px 8px 28px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;gap:3px;font-size:12px}
.plan li b{margin-right:6px;font-weight:600}
.plan li span{color:var(--muted)}
.rem-card{border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;background:var(--surface-2)}
.rem-top{display:flex;gap:10px;align-items:flex-start}
.rem-top .bell{width:18px;height:18px;flex:none;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-top:2px}
.rem-card h3{margin:0;font-size:14px;font-weight:700;display:flex;align-items:center}
/* people & requests */
.people{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.people li{display:grid;grid-template-columns:32px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.people li:last-child{border-bottom:0}
.people img,.people .av{width:32px;height:32px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line)}
.people .nm{min-width:0}
.people .nm strong{display:block;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.people .nm small{color:var(--muted);font-size:12px}
.people .acts,.acts{display:flex;gap:6px}
.people select{font:inherit;font-size:12px;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:6px;padding:4px 6px;height:30px}
/* overview heatmap */
.heat-wrap{overflow-x:auto}
.heat{border-collapse:separate;border-spacing:3px;width:100%;font-size:11px}
.heat th{font-weight:600;color:var(--muted);text-align:center;white-space:nowrap;padding:2px}
.heat tbody th{text-align:left;color:var(--ink);font-size:12px;font-weight:600;padding-right:6px}
.hc{width:100%;min-width:32px;height:28px;border:0;border-radius:4px;font-weight:600;font-size:12px;background:var(--surface-2);color:var(--muted)}
.hc.ok{background:var(--ok-soft);color:var(--ok)} .hc.warn{background:var(--warn-soft);color:var(--warn)} .hc.bad{background:var(--bad-bar);color:#ffffff}
.hc:hover{box-shadow:0 0 0 2px var(--accent)}

/* ---------- owner console ---------- */
.owner-hero{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:20px 24px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:18px}
.owner-hero h1{margin:0;font-weight:700;font-size:24px;letter-spacing:-.01em}
.owner-hero p{margin:4px 0 0;color:var(--muted);font-size:13px}
.owner-hero .nums{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.owner-hero .nums div{padding:8px 16px;border-right:1px solid var(--line)}
.owner-hero .nums div:last-child{border-right:0}
.owner-hero .nums b{display:block;font-size:20px;font-weight:700;line-height:1.2}
.owner-hero .nums span{font-size:11px;color:var(--muted)}
.console{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.console{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card h2{margin:0;font-weight:700;font-size:16px}
.form-row{display:flex;gap:8px;flex-wrap:wrap}
.form-row input{flex:1;min-width:120px}
.schools{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sch{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.sch:last-child{border-bottom:0}
.sch-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.sch-top b{font-size:14px;font-weight:600}
.sch-top span{display:block;font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);background:var(--surface-2);border-radius:12px;padding:1px 2px 1px 9px;font-size:12px;font-weight:600}
.chip button{border:0;background:transparent;color:var(--muted);font-size:11px;padding:1px 6px;border-radius:10px}
.chip button:hover{color:var(--bad)}
.chip.none{padding:1px 9px;color:var(--muted);border-style:dashed;background:transparent}
.del-confirm{background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 30%,transparent);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.del-confirm p{margin:0;font-size:13px}

/* ---------- help & privacy ---------- */
.foot{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding-top:14px;border-top:1px solid var(--line)}
.foot .link{color:var(--muted);font-size:12px;font-weight:500}
.foot .link:hover{color:var(--ink)}
.info{max-width:760px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:12px}
.info-head h1{margin:0;font-weight:700;font-size:28px;letter-spacing:-.01em}
.info-head p{margin:6px 0 0;color:var(--muted);font-size:14px;max-width:62ch}
.info-nav{display:flex;flex-wrap:wrap;gap:6px}
.info-nav a{font-size:12px;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 11px;text-decoration:none}
.info-nav a:hover{border-color:var(--line-2);background:var(--surface-2)}
.info-sec{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 18px;scroll-margin-top:16px}
.info-sec summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;padding:14px 0;font-weight:600;font-size:15px}
.info-sec summary::-webkit-details-marker{display:none}
.info-sec summary::after{content:"";width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
.info-sec[open] summary::after{transform:rotate(-135deg)}
.info-sec dl{margin:0 0 16px;display:flex;flex-direction:column;gap:12px}
.info-sec dt{font-weight:600;font-size:14px}
.info-sec dd{margin:2px 0 0;color:var(--muted);line-height:1.55;max-width:65ch}
.info-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.info-card h2{margin:0;font-weight:700;font-size:15px}
.info-card ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:5px;color:var(--muted);line-height:1.55}
.info-card .sbtn{align-self:flex-start}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);background:#1f2328;color:#ffffff;padding:10px 16px;border-radius:8px;font-weight:500;font-size:13px;z-index:10;max-width:calc(100% - 32px);box-shadow:0 8px 24px -8px rgba(0,0,0,.35)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- student records ---------- */
.rec-btn{align-self:flex-start;color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--line-2))}
.rec-btn:hover{background:var(--accent-soft)}
.people li.has-link .nm{display:flex;flex-direction:column;gap:4px}
.link-sel{align-self:flex-start;max-width:100%}
.pill.mid{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
/* class book table */
.book-wrap{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.book{width:100%;border-collapse:collapse;font-size:13px}
.book th{font-size:11px;font-weight:600;color:var(--muted);text-align:center;padding:8px 6px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.book th:first-child{text-align:left;padding-left:12px}
.book td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center;color:var(--muted)}
.book td:first-child{text-align:left;padding-left:12px;color:var(--ink)}
.book tr:last-child td{border-bottom:0}
.book tbody tr{cursor:pointer}
.book tbody tr:hover{background:var(--accent-soft)}
.bk-name{font-weight:600}
.avg{font-weight:700;color:var(--ink)}
.avg.ok,.avg.g-ok{color:var(--ok)} .avg.warn,.avg.g-warn{color:var(--warn)} .avg.bad,.avg.g-bad{color:var(--bad)}
/* record page */
.record{display:flex;flex-direction:column;gap:16px}
.rec-head{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:18px 22px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
.rec-head h1{margin:2px 0 0;font-size:26px;font-weight:700;letter-spacing:-.01em}
.tiles{display:grid;grid-template-columns:repeat(6,auto);border:1px solid var(--line);border-radius:8px;overflow:hidden}
@media (max-width:760px){.tiles{grid-template-columns:repeat(3,1fr);width:100%}}
.tile{padding:8px 14px;border-right:1px solid var(--line);min-width:84px}
.tile:last-child{border-right:0}
@media (max-width:760px){.tile:nth-child(3){border-right:0}.tile:nth-child(-n+3){border-bottom:1px solid var(--line)}}
.tile b{display:block;font-size:20px;font-weight:700;line-height:1.2}
.tile span{font-size:11px;color:var(--muted)}
.tile.g-ok b{color:var(--ok)} .tile.g-warn b{color:var(--warn)} .tile.g-bad b{color:var(--bad)}
.rec-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.rec-grid.solo{grid-template-columns:minmax(0,1fr)}
@media (max-width:980px){.rec-grid{grid-template-columns:1fr}.rec-form{order:-1}}
.rec-main{display:flex;flex-direction:column;gap:16px;min-width:0}
.rec-form{position:sticky;top:14px}
@media (max-width:980px){.rec-form{position:static}}
/* grades table */
.grades{width:100%;border-collapse:collapse;font-size:13px}
.grades th{font-size:11px;font-weight:600;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.grades th:last-child,.grades td:last-child{text-align:right;width:64px}
.grades td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.grades tr:last-child td{border-bottom:0}
.g-subj{font-weight:600;white-space:nowrap}
.g-subj i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:8px;vertical-align:1px}
.g-chips{display:flex;flex-wrap:wrap;gap:5px}
.g-chip{position:relative;display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 6px;border-radius:6px;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:default}
.g-chip.g-ok{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.g-chip.g-warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.g-chip.g-bad{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.g-x{position:absolute;top:-7px;right:-7px;border:1px solid var(--line-2);background:var(--surface);color:var(--muted);border-radius:8px;font-size:9px;font-weight:700;padding:0 4px;line-height:14px;opacity:0}
.g-chip:hover .g-x,.g-x:focus-visible,.g-x.armed{opacity:1}
.g-x.armed{background:var(--bad-bar);border-color:var(--bad-bar);color:#ffffff;right:-30px;z-index:2}
/* entry lists */
.entries{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.entries li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 12px;border-bottom:1px solid var(--line)}
.entries li:last-child{border-bottom:0}
.re-main{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;min-width:0;font-size:13px}
.re-date{color:var(--muted);font-size:12px;min-width:52px}
.re-subj{font-weight:600}
.re-note{color:var(--ink);flex-basis:100%;padding-left:62px}
@media (max-width:560px){.re-note{padding-left:0}}
.re-side{display:flex;align-items:center;gap:8px;flex:none}
.re-by{font-size:12px;color:var(--muted)}
.rec-del{border:1px solid var(--line-2);background:var(--surface);color:var(--muted);border-radius:4px;font-size:11px;font-weight:700;padding:0 6px;line-height:20px}
.rec-del:hover{color:var(--bad);border-color:var(--bad)}
.rec-del.armed{background:var(--bad-bar);border-color:var(--bad-bar);color:#ffffff}
/* add-entry form */
.kinds button{padding:9px 2px}
.grade-pick{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.grade-pick button{border:1px solid var(--line-2);background:var(--surface);border-radius:6px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;font-size:10px;color:var(--muted);line-height:1.2}
.grade-pick button b{font-size:18px;color:var(--ink)}
.grade-pick button:hover{background:var(--surface-2)}
.grade-pick button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--accent-soft)}
.grade-pick button[aria-pressed="true"] b{color:var(--accent)}

/* =========================================================
   Design rules: data tables · asymmetric dashboard · forms
   ========================================================= */
:root{--mono:ui-monospace,"SF Mono","Cascadia Mono","Segoe UI Mono",Menlo,Consolas,monospace;--hair:color-mix(in srgb,var(--ink) 9%,transparent)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
/* numbers everywhere use the mono face */
.pts strong,.stats b,.owner-hero .nums b,.hc,.fc .barv span,.next .cd b,.g-chip,.avg,.tile b{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---------- data tables ---------- */
.dt-wrap{border:1px solid var(--hair);border-radius:8px;overflow:hidden;background:var(--surface)}
.dt{width:100%;border-collapse:collapse;font-size:13px}
.dt th{font-size:11px;font-weight:600;color:var(--muted);text-align:left;padding:8px 12px;border-bottom:1px solid var(--hair);background:transparent;white-space:nowrap}
.dt td{padding:9px 12px;border-bottom:1px solid var(--hair);color:var(--ink);text-align:left;vertical-align:middle}
.dt tbody tr:last-child td{border-bottom:0}
.dt .num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.dt th.num{font-family:var(--font)}
.dt tbody tr:nth-child(even){background:color-mix(in srgb,var(--ink) 1.6%,transparent)}
.dt tbody tr{transition:background .12s}
.dt tbody tr:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.dt .neg{color:var(--bad);font-weight:600}
.book td:first-child,.book th:first-child{padding-left:12px}
.book td{color:var(--ink)}
.book td.num{color:var(--muted)}
.book td.num .avg{color:var(--ink)}
.book tbody tr{position:relative;cursor:pointer}
/* inline row actions, revealed on hover / keyboard focus */
.row-actions{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;gap:4px;padding:2px 2px 2px 14px;opacity:0;pointer-events:none;transition:opacity .12s;
  background:linear-gradient(to right,transparent,var(--surface) 14px)}
.dt tbody tr:hover .row-actions,.dt tbody tr:focus-within .row-actions{opacity:1;pointer-events:auto}
.row-actions button{border:1px solid var(--hair);background:var(--surface);border-radius:5px;padding:3px 8px;font-size:11.5px;font-weight:600;color:var(--ink);white-space:nowrap}
.row-actions button:hover{border-color:var(--accent);color:var(--accent)}
.row-actions button:last-child{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
@media (hover:none){
  .book tbody tr{position:static}
  .row-actions{position:static;transform:none;opacity:1;pointer-events:auto;background:none;padding:6px 0 0;flex-wrap:wrap}
  .bk-name{display:block}
}
.grades .g-subj{white-space:nowrap}
/* lists get the same hairline container */
.people,.next,.schools,.sugs{border-color:var(--hair)}
.people li,.next>li,.sch,.sug{border-bottom-color:var(--hair)}
.people li select[data-p]{opacity:0;transition:opacity .12s}
.people li:hover select[data-p],.people li:focus-within select[data-p]{opacity:1}
@media (hover:none){.people li select[data-p]{opacity:1}}
.heat .hc{font-size:11.5px}

/* ---------- forms: steps, labels left, hints, focus tint ---------- */
.fstep{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--ink);margin-top:2px}
.fstep-n{width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:11px;font-family:var(--mono);font-weight:700;flex:none}
.frow{display:grid;grid-template-columns:84px minmax(0,1fr);gap:4px 12px;align-items:start;padding:6px;margin:-4px -6px;border-radius:6px;transition:background .15s}
.frow>label,.frow>.flabel{padding-top:9px;font-size:12px;font-weight:600;color:var(--muted);line-height:1.3}
.frow:focus-within{background:color-mix(in srgb,var(--accent) 5%,transparent)}
.frow:focus-within>label{color:var(--accent)}
.fctl{display:flex;flex-direction:column;gap:4px;min-width:0}
.fhint{margin:0;font-size:11.5px;line-height:1.4;color:var(--muted)}
.types+.fhint{margin-top:-8px}
.inp{transition:background .15s,border-color .15s,box-shadow .15s}
.inp:focus{background:color-mix(in srgb,var(--accent) 4%,var(--surface))}
.more-body .frow{margin:0 -6px}
@media (max-width:380px){.frow{grid-template-columns:1fr}.frow>label,.frow>.flabel{padding-top:0}}

/* ---------- record page: asymmetric dashboard ---------- */
.rec-head{background:none;border:0;box-shadow:none;padding:0;display:block}
.rec-head h1{margin:2px 0 0;font-size:30px;font-weight:700;letter-spacing:-.02em}
.rec-dash{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:56px;align-items:start;margin-top:8px}
@media (max-width:980px){.rec-dash{grid-template-columns:1fr;gap:36px}}
.rec-primary{display:flex;flex-direction:column;gap:40px;min-width:0}
.rec-secondary{display:flex;flex-direction:column;gap:36px;min-width:0}
.rec-sec h2{margin:0 0 12px;font-size:13px;font-weight:700;color:var(--ink)}
/* the primary metric */
.kpi{display:grid;grid-template-columns:auto minmax(0,1fr);gap:48px;align-items:end;padding-bottom:32px;border-bottom:1px solid var(--hair)}
@media (max-width:700px){.kpi{grid-template-columns:1fr;gap:24px}}
.kpi-main{display:flex;flex-direction:column;gap:6px}
.kpi-label{font-size:12px;font-weight:600;color:var(--muted)}
.kpi-value{font-size:76px;font-weight:600;line-height:.95;letter-spacing:-.04em;color:var(--ink)}
.kpi-value.g-ok{color:var(--ok)} .kpi-value.g-warn{color:var(--warn)} .kpi-value.g-bad{color:var(--bad)}
.kpi-sub{font-size:13px;color:var(--muted)}
.kpi-side{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin:0}
.kpi-side div{padding:2px 16px;border-left:1px solid var(--hair)}
.kpi-side dt{font-size:11.5px;color:var(--muted);white-space:nowrap}
.kpi-side dd{margin:4px 0 0;font-size:24px;font-weight:600;line-height:1}
.kpi-side dd.neg{color:var(--bad)}
@media (max-width:700px){.kpi-side{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:16px}.kpi-side div:nth-child(4){border-left:0;padding-left:0}.kpi-side div:first-child{border-left:0;padding-left:0}}
/* the one boxed element on the page: the entry form */
.rec-form{position:static;background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.rec-form h2{margin:0;font-size:15px;font-weight:700}
.kinds{grid-template-columns:repeat(4,1fr)}
.grade-pick button{padding:6px 2px}
.grade-pick button b{font-family:var(--mono);font-size:16px}
/* the activity feed */
.feed-filters{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:16px}
.feed-filters button{border:1px solid var(--hair);background:transparent;border-radius:14px;padding:3px 10px;font-size:12px;font-weight:600;color:var(--muted)}
.feed-filters button:hover{color:var(--ink);border-color:var(--line-2)}
.feed-filters button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.feed{list-style:none;margin:0;padding:0;position:relative}
.feed::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:1px;background:var(--hair)}
.fe{display:grid;grid-template-columns:11px minmax(0,1fr);gap:14px;padding-bottom:20px}
.fe:last-child{padding-bottom:0}
.fe-dot{width:11px;height:11px;border-radius:50%;margin-top:4px;background:var(--surface);border:2px solid var(--muted);position:relative;z-index:1}
.fe-grade .fe-dot{border-color:var(--accent)} .fe-absence .fe-dot{border-color:var(--bad-bar)} .fe-praise .fe-dot{border-color:var(--ok-bar)} .fe-remark .fe-dot{border-color:var(--warn-bar)}
.fe-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px}
.fe-subj{font-weight:600}
.fe-date{font-size:11.5px;color:var(--muted);white-space:nowrap}
.fe-what{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:13px;color:var(--muted)}
.fe-what b.mono{font-size:15px;color:var(--ink)}
.fe-what b.g-ok{color:var(--ok)} .fe-what b.g-warn{color:var(--warn)} .fe-what b.g-bad{color:var(--bad)}
.fe-note{margin:4px 0 0;font-size:13px;line-height:1.45;color:var(--ink)}
.fe-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px;min-height:20px;font-size:11.5px;color:var(--muted)}
.fe .rec-del{opacity:0;transition:opacity .12s}
.fe:hover .rec-del,.fe:focus-within .rec-del,.fe .rec-del.armed{opacity:1}
@media (hover:none){.fe .rec-del{opacity:1}}

/* ---------- brand: ClassLoad crest (navy #111630, red #D32A2A) ---------- */
:root{--brand-navy:#111630;--brand-red:#d32a2a;--accent:#1d2657;--accent-hover:#111630;--accent-ink:#ffffff;--accent-soft:#eceef7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent:#a3b1f2;--accent-hover:#c0caf7;--accent-ink:#111630;--accent-soft:#252b4d}}
:root[data-theme="dark"]{--accent:#a3b1f2;--accent-hover:#c0caf7;--accent-ink:#111630;--accent-soft:#252b4d}
.logo{gap:10px;font-weight:800;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-navy)}
.logo-img{height:36px;width:auto;display:block}
:root[data-theme="dark"] .logo{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo{color:var(--ink)}}
.gate-side{justify-content:flex-start;gap:28px}
.gate-logo{width:160px;height:auto;align-self:flex-start}
.gate-copy{display:flex;flex-direction:column;gap:10px}
:root[data-theme="dark"] .gate-logo{background:#ffffff;border-radius:12px;padding:10px 12px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .gate-logo{background:#ffffff;border-radius:12px;padding:10px 12px}}
@media (max-width:760px){.gate-logo{width:120px}}
.tabs button[aria-selected="true"]{border-bottom-color:var(--brand-red)}

/* ---- v8: sign-in method, consent, test law, roll call, assignments, export, change log ---- */
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:6px;overflow:hidden;align-self:flex-start}
.seg button{border:0;background:var(--surface);color:var(--muted);font-weight:600;font-size:13px;padding:6px 14px}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#ffffff}
.pw-form{display:flex;flex-direction:column;gap:10px}
.pw-form .btn-row .btn{flex:none}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.45;color:var(--ink);cursor:pointer}
.consent input{margin-top:2px;width:16px;height:16px;flex:none;accent-color:var(--accent)}
.consent .link{font-size:13px;padding:0}
.ok-t{color:var(--ok);font-weight:600} .bad-t{color:var(--bad);font-weight:600}
.day.law-block{background:repeating-linear-gradient(135deg,transparent 0 7px,color-mix(in srgb,var(--bad) 6%,transparent) 7px 8px)}
.plus.law{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent);opacity:1}
.impact.law .law-ref{font-size:11px;color:var(--muted);margin:0;font-family:var(--mono)}
.law-box,.term-box,.exp-box{display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid var(--hair)}
.law-box h3{margin:0;font-size:14px}
.breach{margin:4px 0 0;padding-left:18px;font-size:13px}
.exp-row,.term-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.term-row .inp{width:auto;flex:1;min-width:140px}
.book-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.roll-sum{font-size:13px;color:var(--muted)}
.roll{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.roll-btn{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:10px 12px;min-height:56px;transition:background .12s,border-color .12s}
.roll-nm{font-weight:600;font-size:14px;color:var(--ink)}
.roll-st{font-size:12px;color:var(--ok);font-weight:600}
.roll-btn.st-absent{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 35%,transparent)} .roll-btn.st-absent .roll-st{color:var(--bad)}
.roll-btn.st-late{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)} .roll-btn.st-late .roll-st{color:var(--warn)}
.ws{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:12px;padding:3px 10px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted)}
button.ws{cursor:pointer} button.ws span{opacity:.6}
.ws-doing{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.ws-submitted{background:color-mix(in srgb,var(--accent) 10%,var(--surface));color:var(--accent);border-color:transparent}
.ws-graded{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.ws-sum{display:flex;flex-wrap:wrap;gap:6px}
.ws-fb{margin:4px 0 0 50px;font-size:12px;color:var(--ink);background:var(--surface-2);border-left:2px solid var(--accent);padding:6px 10px;border-radius:0 4px 4px 0}
.chk-sp{width:20px;flex:none}
.inp.sm{height:30px;font-size:13px;padding:4px 8px}
.dt.work td{vertical-align:middle}
.dt.work td:nth-child(3){min-width:160px}
.hist-tog{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin:-8px 0 12px}
.fe.is-void{opacity:.6}
.fe.is-void .fe-what,.fe.is-void .fe-note{text-decoration:line-through}
.fe-void{margin:2px 0 0;font-size:11px;color:var(--bad)}
.muted{color:var(--muted)}
.fe-meta .link{font-size:12px;padding:0}
@media (max-width:640px){.ws-fb{margin-left:0}.extras{padding-left:0;flex-wrap:wrap}}

/* ---- left sidebar navigation (staff) ---- */
.shell{display:flex;flex-direction:column;gap:18px}
.shell.has-nav{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:start}
.main-col{display:flex;flex-direction:column;gap:18px;min-width:0}
.sidenav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px)}
.sidenav ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.sidenav button{width:100%;display:flex;align-items:center;gap:10px;border:0;background:transparent;border-radius:6px;padding:9px 12px;font:inherit;font-size:14px;font-weight:600;color:var(--muted);text-align:left;cursor:pointer;position:relative}
.sidenav button svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sidenav button:hover{background:var(--surface);color:var(--ink)}
.sidenav button[aria-current="page"]{background:var(--surface);color:var(--accent);box-shadow:inset 0 0 0 1px var(--line)}
.sidenav button[aria-current="page"]::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--brand-red,var(--accent))}
.sidenav .count{margin-left:auto}
/* sections other than Plan use the full width; the calendar is hidden */
.work.wide{grid-template-columns:1fr}

/* =====================================================================
   v28 · ClassLoad design system (SaaS refresh)
   Tokens first; every component below reads them, so dark mode keeps working.
   ===================================================================== */
:root{
  --bg:#F8FAFC; --surface:#FFFFFF; --surface-2:#F1F5F9; --surface-3:#F8FAFC;
  --ink:#334155; --ink-strong:#1E293B; --muted:#64748B; --line:#E2E8F0; --line-2:#CBD5E1; --hair:#E2E8F0;
  --ok:#15803D; --ok-bar:#6FBF8E; --ok-soft:#ECFDF3;
  --warn:#A16207; --warn-bar:#EBC25C; --warn-soft:#FEF7E6;
  --bad:#C2413A; --bad-bar:#F08C7F; --bad-soft:#FEF1EF;
  --r:12px; --r-sm:10px; --r-pill:999px;
  --shadow:0 4px 6px -1px rgb(0 0 0 / .05),0 2px 4px -2px rgb(0 0 0 / .03);
  --shadow-lg:0 12px 32px -8px rgb(15 23 42 / .14);
  --fs-xs:.75rem; --fs-sm:.8125rem; --fs-base:.875rem; --fs-md:1rem; --fs-lg:1.25rem; --fs-xl:1.5rem; --fs-2xl:2rem;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink-strong:#F1F5F9;--surface-3:#1a1d22;--r:12px;--r-sm:10px;--r-pill:999px;--shadow:0 4px 6px -1px rgb(0 0 0 / .35);--shadow-lg:0 12px 32px -8px rgb(0 0 0 / .5)}}
:root[data-theme="dark"]{--ink-strong:#F1F5F9;--surface-3:#1a1d22;--shadow:0 4px 6px -1px rgb(0 0 0 / .35);--shadow-lg:0 12px 32px -8px rgb(0 0 0 / .5)}

html{font-size:100%}
body{background:var(--bg);color:var(--ink);font-size:var(--fs-base);line-height:1.55}
h1,h2,h3,h4,.week-head h3,.mc-cls,.class-select,.class-fixed{color:var(--ink-strong)}
.panel h2{font-size:var(--fs-xl);font-weight:700;letter-spacing:-.01em}
.panel .sub,.hint,.fhint,.idle{color:var(--muted)}
.flabel{font-size:var(--fs-xs);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}

/* ---------- cards: one surface, one radius, one shadow ---------- */
.hero,.week,.panel,.mc-card,.dt-wrap,.bk-row,.class-info,.done-sec,.rem-card,.sugs:not(.big),.next,.mc-next,.bk-ro,.teach ul,.people,.sch-list,.month,.ai-panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.next,.mc-next,.bk-ro,.teach ul,.dt-wrap{box-shadow:none}
.impact{border-radius:var(--r-sm);border:1px solid var(--line);border-left-width:1px;background:var(--surface-3);box-shadow:none}
.impact.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 25%,transparent)}
.impact.warn{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 25%,transparent)}
.impact.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 25%,transparent)}
.hero{padding:clamp(16px,2.5vw,28px);gap:clamp(16px,3vw,40px)}
.panel{padding:clamp(16px,2vw,24px)}
.work:not(.wide) .panel,.work.wide .panel{padding-top:clamp(16px,2vw,24px)}
.wrap{gap:20px}

/* ---------- hierarchy in the class header: the verdict is the headline ---------- */
.cls-block .lbl,.school-pill{font-size:var(--fs-sm);color:var(--muted)}
.class-select,.class-fixed{font-size:clamp(1.75rem,1.2rem + 2vw,2.25rem);letter-spacing:-.02em}
.verdict{border-top:1px solid var(--line);padding-top:14px;gap:6px}
.verdict .lead{font-size:clamp(1.0625rem,.95rem + .6vw,1.25rem);font-weight:700;color:var(--ink-strong);letter-spacing:-.01em}
.verdict p{font-size:var(--fs-sm);color:var(--muted)}

/* ---------- chart: more air between bars, desaturated colours ---------- */
.fc-bars,.fc-labels{gap:clamp(8px,1.6vw,18px)}
.fc .barv{max-width:44px;border-radius:6px 6px 2px 2px}
.fc .col.inview{background:color-mix(in srgb,var(--accent) 6%,transparent);border-radius:8px}
.fc-plot{background:linear-gradient(var(--line) 1px,transparent 1px) 0 0/100% 25%;border-bottom-color:var(--line)}
.fc-limit{border-top-color:color-mix(in srgb,var(--bad) 55%,transparent)}

/* v31 sign-in screen: split layout, glass fields, staged entrance */
.auth{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;min-height:calc(100vh - 150px);min-height:calc(100dvh - 150px);width:100%;max-width:1280px;margin:0 auto;padding:8px 0 16px}
.auth-form{display:flex;align-items:center;justify-content:center;padding:24px 16px}
.auth-in{width:100%;max-width:420px;display:flex;flex-direction:column;gap:18px}
.auth-h{margin:0;font-size:clamp(2rem,4vw,2.75rem);font-weight:700;letter-spacing:-.03em;line-height:1.1;color:var(--ink-strong)}
.auth-sub{margin:-6px 0 4px;color:var(--muted);font-size:var(--fs-md);line-height:1.5}
.auth-fields{display:flex;flex-direction:column;gap:16px}
.auth-f{display:flex;flex-direction:column;gap:6px}
.auth-f>span{font-size:var(--fs-sm);font-weight:600;color:var(--muted)}
.glass{position:relative;border:1px solid var(--line);border-radius:16px;background:color-mix(in srgb,var(--ink-strong) 4%,var(--surface));transition:border-color .15s,background .15s,box-shadow .15s}
.glass:focus-within{border-color:color-mix(in srgb,var(--accent) 70%,transparent);background:color-mix(in srgb,var(--accent) 7%,var(--surface));box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 12%,transparent)}
.glass input{width:100%;border:0;background:transparent;font:inherit;font-size:16px;color:var(--ink-strong);padding:15px 16px;border-radius:16px;outline:none}
.glass input::placeholder{color:color-mix(in srgb,var(--muted) 75%,transparent)}
.glass.has-eye input{padding-right:52px}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:10px;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.eye:hover{color:var(--ink-strong);background:var(--surface-2)}
.eye svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.auth-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:var(--fs-sm)}
.auth-keep{display:inline-flex;align-items:center;gap:10px;cursor:pointer;color:var(--ink);font-weight:500}
.auth-keep input{appearance:none;-webkit-appearance:none;width:20px;height:20px;margin:0;border:1.5px solid var(--line-2);border-radius:6px;background:var(--surface);display:grid;place-items:center;cursor:pointer;transition:background .15s,border-color .15s}
.auth-keep input::after{content:"";width:10px;height:6px;border:2px solid var(--accent-ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px);opacity:0}
.auth-keep input:checked{background:var(--accent);border-color:var(--accent)}
.auth-keep input:checked::after{opacity:1}
.auth-row .link{font-size:var(--fs-sm)}
.auth-btn{width:100%;border:0;border-radius:16px;padding:16px;font:inherit;font-size:var(--fs-md);font-weight:700;background:var(--accent);color:var(--accent-ink);cursor:pointer;transition:background .15s,transform .1s}
.auth-btn:not(:disabled):hover{background:var(--accent-hover)}
.auth-btn:not(:disabled):active{transform:scale(.99)}
.auth-btn:disabled{opacity:.6;cursor:wait}
.auth-or{position:relative;display:flex;align-items:center;justify-content:center;font-size:var(--fs-sm);color:var(--muted)}
.auth-or::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid var(--line)}
.auth-or span{position:relative;padding:0 14px;background:var(--bg)}
.auth-g{width:100%;display:flex;align-items:center;justify-content:center;gap:12px;border:1px solid var(--line);border-radius:16px;padding:15px;background:var(--surface);font:inherit;font-size:var(--fs-md);font-weight:600;color:var(--ink-strong);cursor:pointer;transition:background .15s,border-color .15s}
.auth-g:not(:disabled):hover{background:var(--surface-2);border-color:var(--line-2)}
.auth-g:disabled{opacity:.6;cursor:wait}
.auth-foot{margin:0;text-align:center;font-size:var(--fs-sm);color:var(--muted)}
.auth-foot+.auth-foot{margin-top:-10px}
.auth-foot .link{font-size:inherit}
.auth-fine{text-align:center;line-height:1.5}

/* v32 interactive hover buttons */
.ihb{position:relative;overflow:hidden;isolation:isolate;border-radius:999px!important;--ihb-fill:var(--accent);--ihb-ink:var(--accent-ink)}
.ihb:not(.btn):not(.auth-btn):not(.yes):not(.danger){background:var(--surface)}
.btn.ihb,.auth-btn.ihb,.sbtn.yes.ihb{--ihb-fill:var(--surface);--ihb-ink:var(--accent)}
.sbtn.danger.ihb{--ihb-fill:var(--surface);--ihb-ink:var(--bad)}
.danger-ghost.ihb{--ihb-fill:var(--bad-bar);--ihb-ink:#fff}
.ihb .ihb-dot{display:inline-block;flex:none;width:8px;height:8px;border-radius:50%;background:var(--ihb-fill);margin-right:8px;vertical-align:middle;position:relative;z-index:0;transition:transform .5s cubic-bezier(.4,0,.2,1)}
.auth-g.ihb .ihb-dot,.add-btn.ihb .ihb-dot{margin-right:-2px}
.ihb .ihb-a{position:relative;z-index:1;display:inline-flex;align-items:center;justify-content:center;gap:inherit;transition:transform .3s ease,opacity .3s ease}
.ihb .ihb-b{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;gap:8px;padding:inherit;color:var(--ihb-ink);opacity:0;transform:translateX(48px);transition:transform .3s ease,opacity .3s ease;pointer-events:none;white-space:nowrap}
.ihb .ihb-b svg:not(.ihb-arr){stroke:currentColor}
.ihb-arr{flex:none;width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
@media (hover:hover){
  .ihb:not(:disabled):hover .ihb-a{transform:translateX(48px);opacity:0}
  .ihb:not(:disabled):hover .ihb-b{transform:translateX(-2px);opacity:1}
  .ihb:not(:disabled):hover .ihb-dot{transform:scale(120)}
}
.ihb:not(:disabled):focus-visible .ihb-a{transform:translateX(48px);opacity:0}
.ihb:not(:disabled):focus-visible .ihb-b{transform:translateX(-2px);opacity:1}
.ihb:not(:disabled):focus-visible .ihb-dot{transform:scale(120)}
.ihb:disabled .ihb-dot{opacity:.5}
@media (prefers-reduced-motion:reduce){.ihb .ihb-a,.ihb .ihb-b,.ihb .ihb-dot{transition-duration:.01s}}

.sp-in{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;animation:spIn .6s cubic-bezier(.2,.8,.2,1) both}
.sp-mark{width:84px;height:84px;border-radius:24px;padding:18px;display:grid;grid-template-columns:repeat(3,1fr);align-items:end;gap:6px;background:linear-gradient(145deg,rgba(139,92,246,.4),rgba(34,211,238,.2));border:1px solid rgba(165,180,252,.45);box-shadow:0 0 50px rgba(139,92,246,.5),inset 0 0 20px rgba(255,255,255,.08)}

.sp-bar{width:180px;height:3px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}
.sp-bar i{display:block;width:40%;height:100%;border-radius:999px;background:linear-gradient(90deg,#8b5cf6,#22d3ee);box-shadow:0 0 12px #22d3ee;animation:spLoad 1.2s ease-in-out infinite}

@keyframes spEq{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.55)}}

@keyframes spDrift{from{transform:translate(-2%,-1%)}to{transform:translate(2%,2%)}}
@media (prefers-reduced-motion:reduce){.sp-glow,.sp-mark i,.sp-word,.sp-in{animation:none}.sp-bar i{animation-duration:2.4s}}

.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{padding:16px 18px}
.kpi b{font-size:clamp(1.5rem,1.2rem + 1vw,2rem);font-weight:600;letter-spacing:-.02em}
@media (max-width:640px){
  .kpis{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
  .kpis::-webkit-scrollbar{display:none}
  .kpi{flex:0 0 46%;scroll-snap-align:start;padding:12px 14px}
}
/* phone: list / calendar switch */
.mtabs{display:none}
@media (max-width:980px){
  .mtabs:not([hidden]){display:flex;position:sticky;top:calc(var(--bar-h,56px) + 6px);z-index:20;padding:4px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);gap:4px}
  .mtabs button{flex:1;border:0;border-radius:999px;background:transparent;color:var(--muted);font:inherit;font-weight:600;font-size:14px;padding:9px 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
  .mtabs button[aria-pressed="true"]{background:#0F172A;color:#fff}
  :root[data-theme="dark"] .mtabs button[aria-pressed="true"]{background:#fff;color:#0F172A}
  .mtabs .count{font-size:11px;font-weight:700;min-width:20px;padding:1px 6px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
  .mtabs button[aria-pressed="true"] .count{background:rgba(255,255,255,.2);color:inherit}
  .work[data-mtab="list"] .cal-sec{display:none}
  .work[data-mtab="cal"] .panel{display:none}
}
/* quick filter chips; full filters behind one button on phones */
.flt-quick{display:none}
@media (max-width:640px){
  .flt-quick{display:flex;gap:6px;overflow-x:auto;margin:0 -2px 10px;padding:2px;scrollbar-width:none}
  .flt-quick::-webkit-scrollbar{display:none}
  .fq{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:13px;font-weight:600;padding:7px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
  .fq[aria-pressed="true"]{background:#0F172A;border-color:#0F172A;color:#fff}
  :root[data-theme="dark"] .fq[aria-pressed="true"]{background:#fff;border-color:#fff;color:#0F172A}
  .fq-more{margin-left:auto}
  .fq-more .count{font-size:11px;padding:0 6px;border-radius:999px;background:var(--accent);color:var(--accent-ink)}
  .flt{display:none}
  .flt.open{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .flt.open .flt-q{grid-column:1/-1}
  .flt.open .inp.sm{min-width:0;width:100%}
}
/* one colour per task type, everywhere */
.pill.ty,.kind[class*="ty-"]{border:0}
.ty-hw{--ty:#0E9F6E} .ty-quiz{--ty:#C27A06} .ty-test{--ty:#D63A4C} .ty-project{--ty:#7C4DDB}
:root[data-theme="dark"] .ty-hw{--ty:#4ADE9B} :root[data-theme="dark"] .ty-quiz{--ty:#F5B94A} :root[data-theme="dark"] .ty-test{--ty:#FF8291} :root[data-theme="dark"] .ty-project{--ty:#B59BFF}
.pill.ty,.task .kind[class*="ty-"]{background:color-mix(in srgb,var(--ty) 13%,transparent);color:var(--ty)}
.task .kind[class*="ty-"]{font-size:10.5px;letter-spacing:0;font-weight:700;max-width:58%;overflow:hidden;text-overflow:ellipsis}
.m-task b[class*="ty-"]{color:var(--ty)}
.legend-ty{display:inline-flex;gap:4px 12px;flex-wrap:wrap;align-items:center}
.legend-ty i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ty);margin:0 5px 0 0}
/* calm note instead of an error-looking box */
.plus.law{color:var(--muted);border:1px solid var(--line);border-style:solid;background:var(--surface-2);font-weight:500}
/* the details toggle says what it does */
.next .what .more-dot{width:auto;height:20px;padding:0 8px 0 5px;gap:3px;border-radius:999px;font-size:11px;font-weight:600;color:var(--muted)}
.next .what .more-dot svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.next .what .more-dot.open svg{transform:rotate(180deg)}
@media (max-width:900px){.next .what .more-dot{width:20px;padding:0;justify-content:center}.next .what .more-dot span{display:none}}
/* projects get a status circle in the same column as the checkboxes */
.chk.ring{border-radius:50%}
.chk.ring-doing{border-color:var(--warn);background:conic-gradient(var(--warn) 0 50%,var(--surface) 0)}
.chk.ring-submitted,.chk.ring.on{background:var(--ok);border-color:var(--ok)}
/* tick: a short pop */
@keyframes tickPop{0%{transform:scale(.6)}55%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes rowGlow{0%{background:color-mix(in srgb,var(--ok) 16%,transparent)}100%{background:transparent}}
.next li.pop .chk{animation:tickPop .45s cubic-bezier(.2,.8,.2,1)}
.next li.pop{animation:rowGlow .9s ease-out}
/* week done */
.progress{position:relative}
.progress.all .wk-done{color:var(--ok);font-weight:700}
.confetti{position:absolute;inset:-10px 0 auto;height:40px;pointer-events:none;overflow:visible}
.confetti i{position:absolute;top:10px;width:6px;height:9px;border-radius:2px;opacity:0;animation:conf 1.3s ease-out forwards}
.confetti i:nth-child(4n+1){background:#6D5DFC}.confetti i:nth-child(4n+2){background:#14C2E0}.confetti i:nth-child(4n+3){background:#F5B94A}.confetti i:nth-child(4n){background:#0E9F6E}
.confetti i:nth-child(1){left:4%;--dx:-20px}.confetti i:nth-child(2){left:11%;--dx:10px;animation-delay:.05s}.confetti i:nth-child(3){left:18%;--dx:-8px;animation-delay:.1s}.confetti i:nth-child(4){left:26%;--dx:16px}.confetti i:nth-child(5){left:33%;--dx:-14px;animation-delay:.08s}.confetti i:nth-child(6){left:41%;--dx:6px;animation-delay:.12s}.confetti i:nth-child(7){left:48%;--dx:-6px}
.confetti i:nth-child(8){left:55%;--dx:12px;animation-delay:.06s}.confetti i:nth-child(9){left:62%;--dx:-16px;animation-delay:.1s}.confetti i:nth-child(10){left:70%;--dx:8px}.confetti i:nth-child(11){left:77%;--dx:-10px;animation-delay:.04s}.confetti i:nth-child(12){left:84%;--dx:18px;animation-delay:.12s}.confetti i:nth-child(13){left:90%;--dx:-4px}.confetti i:nth-child(14){left:96%;--dx:10px;animation-delay:.07s}
@keyframes conf{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),-34px) rotate(260deg)}}
/* friendlier empty states */
.empty.art{display:flex;flex-direction:column;align-items:center;gap:10px;padding:28px 20px;border-style:solid;border-color:var(--line);background:var(--surface-2);border-radius:18px}
.empty.art b{color:var(--ink-strong);font-size:15px}
.empty-ic{width:64px;height:64px}
@media (prefers-reduced-motion:reduce){.next li.pop,.next li.pop .chk,.confetti i{animation:none}.confetti{display:none}}
/* header: search, bell and you */
.me-desk .me-txt{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1;text-align:left}
.me-desk .me-role{font-size:11px;color:var(--muted);font-weight:500}
.me-desk .me-role.owner{color:var(--accent)}
@media (max-width:980px){
  #hero.hero{background:radial-gradient(60% 80% at 75% 10%,rgba(255,255,255,.22),transparent 60%),linear-gradient(170deg,#55616E 0%,#6C7986 55%,#8794A0 100%)!important;border:0!important;border-radius:22px!important;box-shadow:0 20px 40px -18px rgba(30,40,55,.45)!important;padding:18px!important}
  :root[data-theme="dark"] #hero.hero{background:linear-gradient(170deg,#262D36 0%,#323B46 55%,#3F4955 100%)!important}
}
@media (max-width:980px) and (prefers-color-scheme: dark){:root:not([data-theme="light"]) #hero.hero{background:linear-gradient(170deg,#262D36 0%,#323B46 55%,#3F4955 100%)!important}}
/* v37b fixes */
@media (max-width:560px){#hero .next-big .nb-go{width:100%;flex:1 1 100%;justify-content:center}}
.task .t1{flex-wrap:wrap;row-gap:3px}
.task .t1 span:first-child{flex:1 1 auto;min-width:0}
.task .kind[class*="ty-"]{max-width:100%}
.flt-quick .fq-more{order:-1;margin-left:0}
@media (max-width:640px){.kpi{flex-basis:42%}}
@media (max-width:640px){.tl-row .pill{display:inline-flex;flex:none;font-size:11px;padding:2px 8px}}
/* v38 signed-in app uses the full window */
body.signed-in .wrap{max-width:none}
@media (min-width:1100px){
  body.signed-in{padding:0 28px}
  body.signed-in .bar{margin:0 -28px;padding-left:28px;padding-right:28px}

body.landing-on .lp{max-width:none}
body.landing-on .lp>.lp-sec,body.landing-on .lp>.lp-final{width:100%;max-width:1240px;margin-inline:auto}
body.landing-on .h2-card{max-width:1240px;width:calc(100% - 64px);margin-left:auto;margin-right:auto}
@media (min-width:1100px){body.landing-on{padding:0 20px}}

.h2-devs{position:absolute;left:50%;bottom:9%;width:min(1180px,96%);aspect-ratio:1180/560;transform:translateX(-50%) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.8,.2,1);z-index:1}
.dev{position:absolute}
.dev-scr{position:relative;overflow:hidden;background:#fff;color:#0F172A;font-family:"Inter",var(--font);text-align:left;line-height:1.35}
.dev-in{position:absolute;left:0;top:0;transform-origin:0 0}
.dev-lap{left:19%;width:62%;bottom:0;z-index:2;animation:devFloat 7s ease-in-out infinite}
.dev-lap .dev-scr{aspect-ratio:1000/625;border:12px solid #11151C;border-bottom-width:14px;border-radius:18px 18px 4px 4px;box-shadow:0 30px 60px -20px rgba(15,22,35,.55)}
.dev-lap .dev-in{width:1000px;height:625px}
.dev-base{height:16px;margin:0 -7%;border-radius:0 0 18px 18px;background:linear-gradient(180deg,#DCE1E7,#98A1AB);box-shadow:0 18px 30px rgba(20,28,40,.35)}
.dev-tab{left:0;width:30%;bottom:4%;z-index:1;transform:translateZ(-40px) rotate(-4deg);animation:devFloat 8s ease-in-out -2s infinite}

.dev-tab .dev-in{width:640px;height:460px}
.dev-ph{right:1%;width:15.5%;bottom:-6%;z-index:3;transform:translateZ(40px) rotate(5deg);animation:devFloat 6s ease-in-out -1s infinite}
.dev-ph .dev-scr{aspect-ratio:300/620;border:7px solid #11151C;border-radius:30px;box-shadow:0 30px 50px -16px rgba(15,22,35,.6)}
.dev-ph .dev-in{width:300px;height:620px}
@keyframes devFloat{0%,100%{translate:0 0}50%{translate:0 -8px}}
.h2-floor{bottom:5%;width:min(1100px,90%)}
.h2-hint{position:relative;z-index:2;margin:0 auto;padding:0 0 22px;text-align:center;font-size:13.5px;color:#475569;font-weight:500;max-width:60ch}

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .h2-hint{color:#E6ECF0}}

/* screen contents (drawn at fixed size, then scaled) */
.dev-in button{font:inherit;color:inherit;cursor:pointer}
.dl-bar,.dt-bar{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid #E6EAF0;background:#fff}
.dl-bar b,.dt-bar b{font-weight:700;letter-spacing:.08em;font-size:15px}
.dt-bar b{letter-spacing:0}
.dl-q{margin-left:14px;width:240px;padding:7px 12px;border-radius:999px;background:#F1F4F8;color:#8B95A3;font-size:13px}
